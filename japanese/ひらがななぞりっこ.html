<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひらがな なぞりっこ</title>
<style>
  :root {
    --bg1: #ffe3ee; --bg2: #e3f3ff; --pink: #ff8fb3; --pink-d: #e8679a; --mint: #7fd8be; --mint-d: #3fb592;
    --yellow: #ffe17a; --sky: #8ecdf5; --text: #5a3a4a; --card: #fff;
    --ui: "BIZ UDPGothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Meiryo", sans-serif;
    --kj: "UD デジタル 教科書体 N-R", "UD Digi Kyokasho N-R", "UDDigiKyokashoN-R", "YuKyokasho", "Klee", "Hiragino Sans", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text); font-family: var(--ui);
    background: radial-gradient(circle at 12% 18%, #fff6 0 40px, transparent 41px), radial-gradient(circle at 88% 70%, #fff6 0 60px, transparent 61px),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
    display: flex; flex-direction: column; align-items: center; -webkit-tap-highlight-color: transparent;
  }
  button { font-family: var(--ui); color: var(--text); cursor: pointer; touch-action: manipulation; }
  .top { width: 100%; max-width: 1040px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 16px 4px; font-weight: bold; }
  .top a, .top .link { color: var(--pink-d); text-decoration: none; background: none; border: none; font-size: 1.05rem; font-weight: bold; padding: 6px 0; }
  .top .right { display: flex; gap: 6px; }
  .chip { border: 2px solid #f3c2d4; background: #fff; border-radius: 999px; padding: 5px 12px; font-size: .95rem; font-weight: bold; }
  .wrap { width: 100%; max-width: 1040px; padding: 6px 16px 18px; flex: 1; display: flex; flex-direction: column; }
  .card { background: var(--card); border-radius: 28px; padding: 20px 18px; flex: 1; box-shadow: 0 6px 18px rgba(232, 103, 154, .18); display: flex; flex-direction: column; align-items: center; gap: 14px; }
  h1 { margin: 6px 0 0; font-size: 2.4rem; letter-spacing: .08em; text-align: center; color: var(--pink-d); }
  h1 small { display: block; font-size: 1rem; color: var(--text); letter-spacing: 0; }
  .lead { margin: 0; font-size: 1.2rem; font-weight: bold; text-align: center; }
  .sub { margin: 0; font-size: .9rem; color: #8a6a7a; text-align: center; line-height: 1.6; }
  .btn { border: none; border-radius: 999px; background: #fff; padding: 12px 20px; font-size: 1.1rem; font-weight: bold; box-shadow: 0 3px 0 #f0c5d5, 0 0 0 2px #f6cfdd inset; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #f0c5d5, 0 0 0 2px #f6cfdd inset; }
  .btn.main { background: var(--pink); color: #fff; box-shadow: 0 4px 0 var(--pink-d); }
  .btn.mint { background: var(--mint); color: #fff; box-shadow: 0 4px 0 var(--mint-d); }
  .btn:disabled { opacity: .4; }

  /* はじめ */
  .mascot { font-size: 4.5rem; line-height: 1; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  .start-modes { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .bigmode { width: 250px; border: none; border-radius: 26px; padding: 18px 14px; font-size: 1.35rem; font-weight: bold; color: #fff; }
  .bigmode small { display: block; font-size: .88rem; font-weight: normal; margin-top: 6px; line-height: 1.5; }
  .bigmode .ic { font-size: 2.6rem; display: block; }
  .bigmode.st { background: linear-gradient(135deg, #ffb0c9, var(--pink)); box-shadow: 0 5px 0 var(--pink-d); }
  .bigmode.tc { background: linear-gradient(135deg, #a4e6d3, var(--mint)); box-shadow: 0 5px 0 var(--mint-d); }
  .bigmode.er { background: linear-gradient(135deg, #ffd98a, #f5a623); box-shadow: 0 5px 0 #d4861a; }

  /* なぞって えを けそう */
  .ji.nopic { opacity: .3; pointer-events: none; }
  .er-rounds { display: flex; gap: 10px; justify-content: center; }
  .er-rounds span { position: relative; width: 64px; height: 64px; border-radius: 16px; background: #fff; box-shadow: 0 0 0 3px #f1e3c4; overflow: hidden; }
  .er-rounds span img { width: 100%; height: 100%; display: block; opacity: .35; filter: grayscale(1); }
  .er-rounds span.cur { box-shadow: 0 0 0 4px #f5a623; }
  .er-rounds span.cur img, .er-rounds span.done img { opacity: 1; filter: none; }
  .er-rounds span.done::after { content: "✔"; position: absolute; right: 2px; bottom: 0; color: #fff; background: var(--mint-d); border-radius: 50%; width: 22px; height: 22px; font-size: .85rem; line-height: 22px; text-align: center; }
  .erbox { border-color: #f5c46b; }
  .sticker { transition: transform .25s ease-in, opacity .25s ease-in; transform-box: fill-box; transform-origin: center; }
  .sticker.later { opacity: .45; }
  .sticker.gone { transform: scale(1.8) rotate(25deg); opacity: 0; }
  .sticker circle { fill: #fff; stroke: #f5a623; stroke-width: .7; }
  .er-win { position: absolute; inset: 6%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fffdf8ee; border-radius: 18px; pointer-events: none; animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) both; }
  .er-win img { width: 62%; aspect-ratio: 1; object-fit: contain; }
  .er-win .w { font-family: var(--kj); font-size: clamp(2rem, 6vw, 3rem); letter-spacing: .1em; }
  .er-win .w b { color: var(--pink-d); }

  /* 50音表 */
  .table { display: grid; grid-template-columns: repeat(10, 1fr); direction: rtl; gap: 6px; width: 100%; max-width: 860px; }
  .col { direction: ltr; display: flex; flex-direction: column; gap: 6px; }
  .colhead { border: none; border-radius: 14px; background: var(--yellow); font-weight: bold; font-size: .88rem; line-height: 1.25; padding: 6px 2px; min-height: 2.6em; box-shadow: 0 3px 0 #e6c24f; }
  .colhead:active { transform: translateY(2px); box-shadow: 0 1px 0 #e6c24f; }
  .ji { position: relative; aspect-ratio: 1; border: none; border-radius: 16px; background: #fff4f8; box-shadow: 0 0 0 2px #f7d2df inset; font-family: var(--kj); font-size: clamp(1.4rem, 4.2vw, 2.4rem); padding: 0; }
  .ji.haspic { aspect-ratio: 3 / 4.4; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 6% 4% 4%; background: #fff; box-shadow: 0 0 0 3px #9ad7f0 inset, 0 3px 0 #9ad7f0; }
  .ji.haspic .k { line-height: 1.1; }
  .ji.haspic img { width: 86%; aspect-ratio: 1; object-fit: contain; margin-top: auto; pointer-events: none; }
  .ji.haspic:active { transform: translateY(2px); box-shadow: 0 0 0 3px #9ad7f0 inset; }
  .ji.haspic.done { background: #fff4f8; box-shadow: 0 0 0 3px var(--pink) inset, 0 3px 0 var(--pink); }
  .table.pics .ji.empty { aspect-ratio: 3 / 4.4; }
  .ji.empty { visibility: hidden; }
  .ji.done { background: #fff; box-shadow: 0 0 0 3px var(--pink) inset; }
  .ji .stamp { position: absolute; right: -4px; top: -6px; font-size: clamp(.9rem, 2.2vw, 1.3rem); }
  .colhead .short { display: none; }
  @media (max-width: 600px) { .colhead .full { display: none; } .colhead .short { display: inline; font-size: 1rem; } .colhead { min-height: 0; } .table { gap: 4px; } }
  .kanatabs { display: flex; gap: 8px; justify-content: center; }
  .ktab { border: none; border-radius: 999px; background: #fff4f8; padding: 10px 26px; font-size: 1.25rem; font-weight: bold; box-shadow: 0 0 0 2px #f6cfdd inset; }
  .ktab.on { background: var(--pink); color: #fff; box-shadow: 0 4px 0 var(--pink-d); }
  h3.sec { margin: 6px 0 -4px; align-self: center; font-size: 1.05rem; color: var(--pink-d); border-bottom: 3px dotted #f6b9cf; padding: 0 10px 2px; }
  .count { font-weight: bold; color: var(--pink-d); }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
  select { font-family: var(--ui); font-size: 1rem; padding: 8px; border-radius: 12px; border: 2px solid #f3c2d4; color: var(--text); }

  /* れんしゅう */
  .practice { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; width: 100%; align-items: start; }
  .left { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .tab { border: none; border-radius: 999px; background: #fff4f8; padding: 9px 16px; font-size: 1.05rem; font-weight: bold; box-shadow: 0 0 0 2px #f6cfdd inset; }
  .tab.on { background: var(--pink); color: #fff; box-shadow: none; }
  .tab.glow { animation: glow 1s ease-in-out infinite alternate; }
  @keyframes glow { to { box-shadow: 0 0 0 4px var(--yellow); } }
  .wtitle { margin: 0; font-size: 1.3rem; font-weight: bold; text-align: center; min-height: 1.6em; }
  .wbox { position: relative; width: min(100%, 58vh, 520px); aspect-ratio: 1; background: #fffdf8; border-radius: 18px; border: 4px solid #f6b9cf; touch-action: none; overflow: hidden; }
  .wbox svg, .wbox canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .wbox canvas { touch-action: none; cursor: crosshair; }
  .guide { stroke: #f6cfdd; stroke-width: .6; stroke-dasharray: 2 2; }
  .stk { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .stk.base { stroke: #ececec; stroke-width: 8; }
  .stk.next { stroke: #ffd2a8; stroke-width: 8; }
  .stk.ink { stroke: var(--pen, #e8679a); stroke-width: 6; }
  .stk.faint { stroke: #f3d7e1; stroke-width: 5; }
  .stk.hint { stroke: #ffd2a8; stroke-width: 6; stroke-dasharray: 3 3; }
  .snum { font-size: 7px; fill: #e0505a; font-weight: bold; font-family: var(--ui); }
  .startdot { fill: #3fb592; }
  .startdot.pulse { animation: pulse 1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 50% { transform: scale(1.5); } }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .msg { min-height: 1.6em; font-size: 1.1rem; font-weight: bold; text-align: center; margin: 0; }
  .msg.try { color: #e07a2b; }
  .msg.ok { color: var(--mint-d); }
  .side { display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
  .bunny { display: flex; gap: 8px; align-items: flex-start; }
  .bunny .face { font-size: 3rem; line-height: 1; }
  .bubble { position: relative; flex: 1; background: #fff4f8; border-radius: 16px; padding: 10px 12px; font-weight: bold; font-size: 1rem; line-height: 1.5; box-shadow: 0 0 0 2px #f6cfdd inset; min-height: 3.2em; }
  .word { background: #fffbe8; border-radius: 20px; padding: 12px; text-align: center; box-shadow: 0 0 0 2px #f6e3a3 inset; }
  .word button { border: none; background: none; padding: 0; width: 100%; }
  .word .em { font-size: 4rem; line-height: 1.1; display: block; }
  .word .w { font-family: var(--kj); font-size: 2rem; letter-spacing: .1em; }
  .word .w b { color: var(--pink-d); }
  .word .say { font-size: .85rem; color: #8a6a7a; }
  .word .pic { display: block; width: min(100%, 180px); aspect-ratio: 1; margin: 0 auto 4px; border-radius: 16px; background: #fff; object-fit: contain; }
  .thumbs { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
  .word .thumbs button { width: 52px; height: 52px; padding: 0; border-radius: 12px; background: #fff; overflow: hidden; box-shadow: 0 0 0 2px #f6e3a3; }
  .word .thumbs button.on { box-shadow: 0 0 0 3px var(--pink-d); }
  .thumbs img { width: 100%; height: 100%; display: block; }
  .pens { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; font-size: .9rem; font-weight: bold; }
  .pen { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px #ddd; padding: 0; }
  .pen.on { box-shadow: 0 0 0 3px var(--text); }
  .row-dots { display: flex; gap: 6px; justify-content: center; }
  .row-dots button { position: relative; width: 44px; height: 44px; border-radius: 12px; border: none; background: #fff4f8; font-family: var(--kj); font-size: 1.4rem; box-shadow: 0 0 0 2px #f6cfdd inset; padding: 0; }
  .row-dots button.cur { background: var(--pink); color: #fff; box-shadow: none; }
  .row-dots button.done::after { content: "🌸"; position: absolute; font-size: .75rem; right: -5px; top: -7px; }

  /* ごほうび */
  .reward { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .hanamaru { width: 92%; height: 92%; animation: pop .6s cubic-bezier(.3, 1.6, .5, 1) both; }
  @keyframes pop { from { transform: scale(.2) rotate(-30deg); opacity: 0; } }
  .confetti { position: fixed; top: -20px; font-size: 1.6rem; pointer-events: none; animation: fall linear forwards; z-index: 10; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

  /* ゲーム */
  .gamebtn { font-size: 1.25rem; padding: 12px 26px; }
  .g-opts { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .g-opt { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; font-weight: bold; }
  .lv { border: none; border-radius: 999px; background: #fff4f8; padding: 9px 16px; font-size: 1.05rem; font-weight: bold; box-shadow: 0 0 0 2px #f6cfdd inset; }
  .lv.on { background: var(--yellow); box-shadow: 0 3px 0 #e6c24f; }
  .bigmode.fs { background: linear-gradient(135deg, #ffb7a8, #ff8a7a); box-shadow: 0 5px 0 #e0614f; }
  .bigmode.nb { background: linear-gradient(135deg, #a9d8ff, #4aa3e0); box-shadow: 0 5px 0 #2f7fbf; }
  .g-head { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .g-dots { display: flex; gap: 4px; flex-wrap: wrap; }
  .g-dots span { width: clamp(20px, 6vw, 28px); aspect-ratio: 1; border-radius: 50%; background: #fff4f8; box-shadow: 0 0 0 2px #f6cfdd inset; display: flex; align-items: center; justify-content: center; font-size: .85rem; }
  .g-dots span.cur { box-shadow: 0 0 0 3px var(--pink) inset; }
  .g-word { display: flex; justify-content: center; align-items: flex-end; gap: 4px; flex-wrap: wrap; min-height: 1.3em; font-family: var(--kj); font-size: clamp(2.2rem, 7vw, 4.2rem); line-height: 1.2; }
  .g-word .sp { width: .4em; }
  .g-word .ch { min-width: 1.05em; text-align: center; }
  .g-word .hole { position: relative; width: 1.05em; height: 1.25em; }
  .g-word .hole::before { content: ""; position: absolute; inset: .02em .06em .12em; border-radius: 50% 50% 46% 46% / 55% 55% 45% 45%; border: .06em dashed #ff8fb3; background: #fff4f8; }
  .g-word .hole.fill::before { display: none; }
  .g-word .hole b { position: relative; display: block; text-align: center; color: var(--pink-d); animation: pop .45s cubic-bezier(.3, 1.6, .5, 1) both; }
  .g-word .box { width: 1.15em; height: 1.2em; border: .07em solid #4aa3e0; border-radius: .12em; background: #fff; text-align: center; line-height: 1.1; }
  .g-word .box.next { background: #eaf6ff; box-shadow: 0 0 0 .06em #ffd36b; }
  .g-word .box b { display: block; animation: pop .45s cubic-bezier(.3, 1.6, .5, 1) both; }
  .g-board { position: relative; width: min(100%, 360px, 44vh); aspect-ratio: 4 / 3; background: #fff; border: 10px solid #d9d9d9; border-radius: 14px; box-shadow: 0 6px 0 #bdbdbd; display: flex; align-items: center; justify-content: center; }
  .g-board img { position: absolute; left: 4%; top: 4%; width: 92%; height: 92%; object-fit: contain; }
  .g-board .say { position: absolute; right: -12px; bottom: -14px; width: 52px; height: 52px; border-radius: 50%; border: none; background: var(--yellow); box-shadow: 0 3px 0 #e6c24f; font-size: 1.5rem; padding: 0; }
  .g-board .ok { position: absolute; left: 20%; top: 8%; width: 60%; aspect-ratio: 1; border: 12px solid #e8303f; border-radius: 50%; opacity: .6; pointer-events: none; animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) both; }
  .g-bals { display: flex; justify-content: center; align-items: flex-start; gap: clamp(6px, 2vw, 18px); flex-wrap: wrap; padding: 6px 0 20px; }
  .bal { position: relative; width: clamp(48px, 14vw, 96px); aspect-ratio: 5 / 6; border: none; padding: 0; border-radius: 50% 50% 46% 46% / 55% 55% 45% 45%;
    background: radial-gradient(circle at 32% 26%, #fff9 0 9%, transparent 10%), var(--bc); box-shadow: inset -6px -8px 0 #0001;
    font-family: var(--kj); font-size: clamp(2rem, 6vw, 3.2rem); color: #333; margin-top: var(--y, 0); animation: float 2.6s ease-in-out infinite; animation-delay: var(--d, 0s); }
  .bal::after { content: ""; position: absolute; left: 50%; bottom: -16px; width: 2px; height: 16px; background: #999; }
  .bal::before { content: ""; position: absolute; left: calc(50% - 5px); bottom: -5px; border: 5px solid transparent; border-bottom-color: var(--bc); }
  @keyframes float { 50% { transform: translateY(-7px); } }
  .bal.fly { animation: none; transition: transform .55s cubic-bezier(.4, -.2, .6, 1), opacity .2s .45s; z-index: 5; }
  .bal.popped { animation: popout .45s ease-in forwards; pointer-events: none; }
  @keyframes popout { 30% { transform: translateX(-6px) rotate(-8deg); } 60% { transform: translateX(6px) scale(1.1); } to { transform: scale(.1); opacity: 0; } }
  .bal.glow, .tile.glow { animation: glow 0.8s ease-in-out infinite alternate; }
  .g-tiles { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; max-width: 640px; }
  .tile { width: clamp(58px, 13vw, 84px); aspect-ratio: 1; border: 4px solid #4aa3e0; border-radius: 12px; background: #fff; font-family: var(--kj); font-size: clamp(2rem, 6vw, 3rem); padding: 0; box-shadow: 0 4px 0 #2f7fbf; }
  .tile:active { transform: translateY(3px); box-shadow: 0 1px 0 #2f7fbf; }
  .tile.used { visibility: hidden; }
  .tile.shake { animation: shake .4s; background: #ffe9e9; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .g-result { font-size: 1.4rem; font-weight: bold; text-align: center; line-height: 1.7; }
  .g-result .stars { font-size: 2rem; letter-spacing: .05em; word-break: break-all; }
  body.teacher .g-board { width: min(100%, 460px, 50vh); }
  body.teacher .bal { width: clamp(50px, 14vw, 120px); font-size: clamp(2.2rem, 7vw, 4rem); }
  body.teacher .tile { width: clamp(64px, 13vw, 100px); font-size: clamp(2.2rem, 6vw, 3.6rem); }

  /* 先生モード：大きく */
  body.teacher .wbox { width: min(100%, 74vh, 760px); }
  body.teacher .practice { grid-template-columns: minmax(0, 1fr) 300px; }
  body.teacher .tab, body.teacher .btn { font-size: 1.3rem; }
  body.teacher .wtitle { font-size: 1.7rem; }

  @media (max-width: 760px) {
    .practice, body.teacher .practice { grid-template-columns: 1fr; }
    .bunny .face { font-size: 2.2rem; }
    .word { display: flex; align-items: center; gap: 10px; padding: 6px 12px; }
    .word .em { font-size: 2.6rem; }
    .word .pic { width: 84px; margin: 0; }
    .word .thumbs { flex-direction: column; gap: 4px; margin: 0; }
    .word .thumbs button { width: 36px; height: 36px; }
    .word .w { font-size: 1.6rem; }
    .wbox { width: min(100%, 56vh); }
  }

  .credit { font-size: .75rem; color: #8a6a7a; text-align: center; padding: 6px 16px 14px; }
  .credit a { color: #8a6a7a; }

  /* プリント */
  #print { display: none; }
  @media print {
    @page { size: A4 portrait; margin: 12mm; }
    body { background: #fff; display: block; }
    body > *:not(#print) { display: none !important; }
    #print { display: block; color: #000; font-family: var(--ui); }
    .p-head { display: flex; justify-content: space-between; font-size: 12pt; margin-bottom: 6mm; }
    .p-row { display: flex; gap: 2mm; margin-bottom: 4mm; align-items: center; break-inside: avoid; }
    .p-info { width: 18mm; text-align: center; font-size: 10pt; }
    .p-info .e { font-size: 18pt; }
    .p-info .e img { width: 16mm; height: 16mm; display: block; margin: 0 auto; }
    .p-box { width: 24mm; height: 24mm; border: 1px solid #999; position: relative; }
    .p-box svg { width: 100%; height: 100%; display: block; }
    .p-box .guide { stroke: #ccc; stroke-width: .5; }
    .p-box .stk.ink { stroke: #000; stroke-width: 4; }
    .p-box .stk.trace { stroke: #bbb; stroke-width: 4; }
    .p-box .snum { fill: #d00; font-size: 8px; }
    .p-foot { font-size: 8pt; color: #555; margin-top: 4mm; }
  }
</style>
</head>
<body>
<div class="top">
  <a href="../index.html" id="back">← もどる</a>
  <div class="right">
    <button class="chip" id="sound">🔔 おと：オン</button>
    <button class="chip" id="modeChip"></button>
  </div>
</div>
<div class="wrap"><div class="card" id="view"></div></div>

// ───────── 保存（この ブラウザの 中だけ） ─────────
const KEY = 'hiragana-nazorikko';
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
const store = Object.assign({ stamps: {}, pen: 0, sound: true }, load());

// ───────── 状態 ─────────
const Q = new URLSearchParams(location.search);
const S = { mode: Q.get('mode') === 'teacher' ? 'teacher' : Q.get('mode') === 'student' ? 'student' : '', kana: 'hira', row: 0, k: 'あ', tab: 'see', play: Q.get('play') === 'erase' ? 'erase' : '' };

const teacher = () => S.mode === 'teacher';

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ───────── 音 ─────────
let jaVoice = null;
function pickVoice() { try { jaVoice = speechSynthesis.getVoices().find(v => /^ja/i.test(v.lang)) || null; } catch (e) {} }
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
// 読み上げ：VOICEVOX（ずんだもん）の音声があれば それを、なければ ブラウザの声で よむ
let voiceAudio = null;
function speak(text) {
  const t0 = String(text).replace(/\s+/g, '');
  // カタカナの ことばは、同じ よみの ひらがなの 音声でも よめる（パンダ → ぱんだ）
  const id = typeof VOICE !== 'undefined' && (VOICE[t0] || VOICE[t0.replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))]);
  if (voiceAudio) { voiceAudio.pause(); voiceAudio = null; }
  if (id) {
    try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {}
    const a = new Audio('hiragana/voice/' + id + '.m4a');
    voiceAudio = a;
    a.play().catch(() => { if (voiceAudio === a) { voiceAudio = null; ttsSpeak(text); } });
    return;
  }
  ttsSpeak(text);
}
function ttsSpeak(text) {
  if (!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.rate = 0.8; u.pitch = 1.2; if (jaVoice) u.voice = jaVoice;
    speechSynthesis.speak(u);
  } catch (e) {}
}
let actx = null;
function tone(notes) {
  if (!store.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    notes.forEach(([f, t, d]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      const s = actx.currentTime + t;
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.18, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + d);
      o.connect(g).connect(actx.destination); o.start(s); o.stop(s + d + 0.05);
    });
  } catch (e) {}
}
const sfx = {
  stroke: () => tone([[880, 0, .15]]),
  miss: () => tone([[330, 0, .18]]),
  clear: () => tone([[784, 0, .2], [988, .12, .2], [1319, .24, .4]]),
};

function setURL(p) {

  if (erase()) u.set('play', 'erase');
  if (S.kana !== 'hira') u.set('kana', S.kana);
  Object.entries(p || {}).forEach(([k, v]) => u.set(k, v));
  try { history.replaceState(null, '', '?' + u.toString()); } catch (e) {}
}

  view.innerHTML = `
    <div class="kanatabs">${Object.entries(KANA).map(([id, k]) => `<button class="ktab${id === S.kana ? ' on' : ''}" data-kana="${id}">${k.label}</button>`).join('')}</div>

    <p class="lead">れんしゅうする 字を えらんでね</p>
    <p class="sub">うえの <b>〇ぎょう</b> を おすと、その ぎょうを じゅんばんに れんしゅうできるよ</p>
    ${secHtml}
    <p class="count">🌸 かけた${set.label}：${n} ／ ${ALL.length}${n === ALL.length ? '　ぜんぶ かけたね！🎉' : ''}</p>
    <div class="tools">

      ${n ? '<button class="btn" id="resetBtn">🧽 スタンプを けす</button>' : ''}

  view.querySelectorAll('.ji[data-k]').forEach(b => b.onclick = () => openChar(+b.dataset.row, b.dataset.k));
  view.querySelector('#gameBtn').onclick = showGameMenu;
  view.querySelector('#printBtn').onclick = () => printSheet(view.querySelector('#prow').value);
  const rb = view.querySelector('#resetBtn');
  if (rb) rb.onclick = () => { if (confirm(`あつめた ${set.label}の スタンプを ぜんぶ けしますか？`)) { ALL.forEach(k => delete store.stamps[k]); save(); showTable(); } };
}

// ───────── れんしゅう画面 ─────────
function rowOf(k) { return ROWS.findIndex(r => r.ks.includes(k)); }
function openChar(row, k, tab) {
  S.row = row; S.k = k; showPractice(tab || 'see');
}

function strokeSvg(k, cls, opt = {}) {
  const st = STROKES[k]; if (!st) return '';
  const guide = opt.guide === false ? '' : '<line class="guide" x1="54.5" y1="0" x2="54.5" y2="109"/><line class="guide" x1="0" y1="54.5" x2="109" y2="54.5"/>';
  const paths = st.s.map((d, i) => `<path class="stk ${typeof cls === 'function' ? cls(i) : cls}" data-i="${i}" d="${d}"/>`).join('');
  const nums = opt.nums ? st.n.map((p, i) => `<text class="snum" x="${p[0]}" y="${p[1]}">${i + 1}</text>`).join('') : '';
  return `<svg viewBox="0 0 109 109" xmlns="${SVGNS}">${guide}${paths}${nums}</svg>`;
}

const picSrc = (k, i) => `hiragana/img/${encodeURIComponent(k + (i + 1))}.png`;

  const box = view.querySelector('#word'), word = picWord(k), n = picNo[k] || 0;
  const wordHtml = word ? esc(word).replace(k, `<b>${k}</b>`) : `<b>${k}</b>`;
  const pic = PICS[k] ? `<img class="pic" src="${picSrc(k, n)}" alt="${esc(word)}">` : `<span class="em">${WORDS[k] ? WORDS[k][0] : '🔤'}</span>`;
  box.innerHTML = `<button id="wordBtn">${pic}<span class="w">${wordHtml}</span><span class="say" style="display:block">${word ? '🔊 おすと よむよ' : 'あまり つかわない 字だよ'}</span></button>`
    + (PICS[k] ? `<div class="thumbs">${PICS[k].map((w, i) => `<button class="${i === n ? 'on' : ''}" data-i="${i}" aria-label="${esc(w)}"><img src="${picSrc(k, i)}" alt=""></button>`).join('')}</div>` : '');
  box.querySelector('#wordBtn').onclick = () => speak(word ? word.replace(/\s+/g, '') : sayName(k));
  box.querySelectorAll('.thumbs button').forEach(b => b.onclick = () => {
    picNo[k] = +b.dataset.i; drawWord(k); speak(picWord(k).replace(/\s+/g, ''));
  });
}

function showPractice(tab) {

    <div class="row-dots">${row.ks.filter(Boolean).map(c => `<button data-k="${c}" class="${c === k ? 'cur' : ''}${store.stamps[c] ? ' done' : ''}">${c}</button>`).join('')}</div>
    <div class="practice">
      <div class="left">

        <div class="acts">

const bubble = t => { const b = view.querySelector('#bubble'); if (b) b.textContent = t; };
let pad = null;

function bindWrite(firstTab) {
  const k = S.k, st = STROKES[k];
  const box = view.querySelector('#wbox'), acts = view.querySelector('#acts'), msg = view.querySelector('#msg'), title = view.querySelector('#wtitle');
  const tabs = [...view.querySelectorAll('.tab')];
  if (!st) { msg.className = 'msg try'; msg.textContent = '書きじゅんの データが よみこめませんでした'; return; }
  let timer = null;
  const stop = () => { if (timer) { clearTimeout(timer); timer = null; } };
  cleanup = () => { stop(); try { speechSynthesis.cancel(); } catch (e) {} };

  // 👀 みる：書きじゅんの アニメーション
  function see() {
    title.textContent = teacher() ? `「${k}」の 書きじゅん` : 'かきじゅんを みてみよう';
    bubble(teacher() ? '「1かくずつ」で、みんなで そらがき しよう'
      : SMALL.includes(k) ? `ちいさい「${String.fromCharCode(k.charCodeAt(0) + 1)}」は、ますの みぎうえに ちいさく かくよ。ばしょも よく みてね`
      : k === 'ー' ? 'のばす ぼうは たてに まっすぐ。うえから したへ かくよ'
      : /[\u3099\u309A]/.test(k.normalize('NFD')) ? `「${k}」は ${st.s.length}かく。てんてん・まるは さいごに かくよ`
      : `「${k}」は ${st.s.length}かく だよ。よく みててね`);
    box.innerHTML = strokeSvg(k, 'faint');
    const svg = box.querySelector('svg');
    const inkPaths = [...svg.querySelectorAll('path')].map(p => {
      const q = p.cloneNode(); q.setAttribute('class', 'stk ink'); svg.appendChild(q);
      const L = q.getTotalLength(); q.style.strokeDasharray = L; q.style.strokeDashoffset = L; q._L = L; return q;
    });
    const nums = st.n.map((p, i) => { const t = document.createElementNS(SVGNS, 'text'); t.setAttribute('class', 'snum'); t.setAttribute('x', p[0]); t.setAttribute('y', p[1]); t.textContent = i + 1; t.style.display = 'none'; svg.appendChild(t); return t; });
    let shown = 0;
    const draw = i => {
      const p = inkPaths[i]; nums[i].style.display = '';
      p.style.transition = 'none'; p.style.strokeDashoffset = p._L; void p.getBoundingClientRect();
      const sec = Math.max(0.6, p._L / 70);
      p.style.transition = `stroke-dashoffset ${sec}s linear`; p.style.strokeDashoffset = 0;
      return sec * 1000 + 350;
    };
    const reset = () => { stop(); shown = 0; inkPaths.forEach(p => { p.style.transition = 'none'; p.style.strokeDashoffset = p._L; }); nums.forEach(t => t.style.display = 'none'); };
    const playAll = () => {
      reset();
      const loop = () => {
        if (shown >= inkPaths.length) { timer = null; if (!teacher()) { tabs[1].classList.add('glow'); bubble('こんどは なぞって みよう！'); } return; }
        timer = setTimeout(loop, draw(shown++));
      };
      loop();
    };
    const one = () => { stop(); if (shown >= inkPaths.length) reset(); draw(shown++); };
    acts.innerHTML = `<button class="btn" id="wSay">🔊 よむ</button><button class="btn" id="wPlay">▶ さいしょから</button><button class="btn" id="wOne">1かくずつ ▶</button>
      <button class="btn main" id="wNext">☝️ なぞって みよう</button>`;
    acts.querySelector('#wSay').onclick = () => speak(sayName(k));
    acts.querySelector('#wPlay').onclick = playAll;
    acts.querySelector('#wOne').onclick = one;
    acts.querySelector('#wNext').onclick = () => setTab('trace');
    if (teacher()) reset(); else { speak(sayName(k)); playAll(); }
  }

  // 書いた線を うけとる キャンバス
  function makeCanvas(onStroke) {
    const cv = document.createElement('canvas'); box.appendChild(cv);
    const ctx = cv.getContext('2d');
    let pts = null, pid = null, fadeT = 0, dpr = 1, ink = PENS[store.pen][0];
    // キャンバスの 大きさを 見えている 大きさに あわせる。画面の 大きさや ズームが かわったら つくりなおす
    // （まえは 作った しゅんかんの 大きさで きめていたので、ずれると 線が ぼやけたり 消えたり していた）
    const fit = () => {
      const w = cv.clientWidth, h = cv.clientHeight, d = window.devicePixelRatio || 1;
      if (!w || !h) return;
      if (cv.width === Math.round(w * d) && cv.height === Math.round(h * d)) return;
      dpr = d; cv.width = Math.round(w * d); cv.height = Math.round(h * d);
      ctx.setTransform(d, 0, 0, d, 0, 0);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = ink; ctx.lineWidth = Math.max(9, w / 26);
      if (pts) for (let i = 0; i < pts.length; i++) seg(pts[Math.max(0, i - 1)], pts[i]);   // かいている とちゅうなら かきなおす
    };
    const at = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
    const wipe = () => { clearTimeout(fadeT); cv.style.transition = ''; cv.style.opacity = ''; ctx.clearRect(0, 0, cv.width / dpr, cv.height / dpr); ctx.beginPath(); };
    // 線は 1本の パスに ためずに、点と点の あいだを その場で かく（Chromebook で 線が とぎれたり 消えたり しないように）
    const seg = (a, b) => { ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); };
    fit();
    if (window.ResizeObserver) new ResizeObserver(fit).observe(cv); else window.addEventListener('resize', fit);
    cv.onpointerdown = e => {
      e.preventDefault();
      if (pid !== null) return;                       // 2本めの ゆび・てのひらは むし
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      fit(); wipe();                                  // まちがいの 線が のこっていたら けす
      pid = e.pointerId; try { cv.setPointerCapture(pid); } catch (x) {}
      pts = [at(e)]; seg(pts[0], pts[0]);
    };
    cv.onpointermove = e => {
      if (!pts || e.pointerId !== pid) return;
      e.preventDefault();
      const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
      for (const ev of (list.length ? list : [e])) { const p = at(ev), q = pts[pts.length - 1]; if (dist(p, q) < 0.5) continue; seg(q, p); pts.push(p); }
    };
    const end = e => {
      if (!pts || (e && e.pointerId !== pid)) return;
      const p = pts; pts = null; pid = null;
      const b = cv.getBoundingClientRect(); onStroke(p.map(q => [q[0] / b.width * 109, q[1] / b.height * 109]));
    };
    cv.onpointerup = end; cv.onpointercancel = end; cv.onlostpointercapture = end;
    return {
      clear: wipe,
      // まちがえた 線は すぐに けさず、すこし みせてから うすく きえる
      fade: () => { clearTimeout(fadeT); cv.style.transition = 'opacity .5s'; fadeT = setTimeout(() => { cv.style.opacity = '0'; fadeT = setTimeout(wipe, 500); }, 600); },
      color: c => { ink = c; ctx.strokeStyle = c; }
    };
  }

  // 1画の はんてい（書きじゅんどおりの 画と くらべる）
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  const near = (pt, line) => line.reduce((m, q) => Math.min(m, dist(pt, q)), 1e9);
  const sample = p => { const L = p.getTotalLength(), n = Math.max(6, Math.round(L / 4)); return Array.from({ length: n + 1 }, (_, i) => { const q = p.getPointAtLength(L * i / n); return [q.x, q.y]; }); };
  function match(drawn, path, tol) {
    const ref = sample(path), L = path.getTotalLength();
    if (drawn.length < 2) drawn = [drawn[0], drawn[0]];
    let len = 0; for (let i = 1; i < drawn.length; i++) len += dist(drawn[i - 1], drawn[i]);
    const startOk = dist(drawn[0], ref[0]) < tol + 5;
    const endOk = dist(drawn[drawn.length - 1], ref[ref.length - 1]) < tol + 7;
    const cover = ref.filter(q => near(q, drawn) < tol).length / ref.length;
    const stray = drawn.filter(q => near(q, ref) > tol + 8).length / drawn.length;
    // 向きが ぎゃく（おわりから 書いた）かどうか
    const reversed = dist(drawn[0], ref[ref.length - 1]) < tol + 5 && dist(drawn[drawn.length - 1], ref[0]) < tol + 7 && cover > 0.6;
    return { ok: startOk && endOk && cover > 0.68 && stray < 0.28 && len > L * 0.5, reversed, shapeOk: cover > 0.6 && stray < 0.3 };
  }

  // ☝️ なぞる ／ ✍️ かく（どちらも 1画ずつ、書きじゅんどおりか しらべる）
  function practice(kind) {
    const isTrace = kind === 'trace';
    const tol = isTrace ? 15 : 19;
    title.textContent = isTrace ? '● から なぞろう！' : 'みないで かいて みよう！';
    bubble(isTrace ? 'みどりの ● から、オレンジの せんを なぞってね' : 'おてほんは かくれているよ。かきじゅんに きをつけてね');
    tabs.forEach(t => t.classList.remove('glow'));
    box.innerHTML = strokeSvg(k, i => isTrace ? (i === 0 ? 'next' : 'base') : 'hide');
    const svg = box.querySelector('svg');
    const paths = [...svg.querySelectorAll('path.stk')];
    if (!isTrace) paths.forEach(p => p.style.display = 'none');
    const dot = document.createElementNS(SVGNS, 'circle'); dot.setAttribute('r', '4.5'); dot.setAttribute('class', 'startdot pulse'); svg.appendChild(dot);
    let cur = 0, miss = 0;
    const showDot = on => { dot.style.display = on && cur < paths.length ? '' : 'none'; };
    const placeDot = () => { if (cur < paths.length) { const q = paths[cur].getPointAtLength(0); dot.setAttribute('cx', q.x); dot.setAttribute('cy', q.y); } };
    const showHint = () => { const p = paths[cur]; p.style.display = ''; p.setAttribute('class', 'stk hint'); };
    pad = makeCanvas(drawn => {
      if (cur >= paths.length) return;
      const r = match(drawn, paths[cur], tol);
      if (r.ok) {
        const p = paths[cur]; p.style.display = ''; p.setAttribute('class', 'stk ink'); p.style.stroke = PENS[store.pen][0];
        cur++; miss = 0; pad.clear(); sfx.stroke();
        if (cur < paths.length) { if (isTrace) paths[cur].setAttribute('class', 'stk next'); placeDot(); showDot(isTrace); msg.className = 'msg ok'; msg.textContent = `${cur}かくめ OK！`; }
        else { showDot(false); finish(isTrace); }
        return;
      }
      miss++; pad.fade(); sfx.miss();
      // ほかの画を 先に 書いていないか
      const other = paths.findIndex((p, i) => i > cur && match(drawn, p, tol).ok);
      msg.className = 'msg try';
      if (other >= 0) msg.textContent = `それは ${other + 1}かくめ だよ。いまは ${cur + 1}かくめ！`;
      else if (r.reversed) msg.textContent = 'むきが はんたい だよ。● から かいてね';
      else if (!isTrace && miss === 1) msg.textContent = `おしい！ ${cur + 1}かくめを もういちど`;
      else msg.textContent = isTrace ? (miss >= 2 ? '● から、オレンジの せんの うえを ゆっくり なぞってね' : 'おしい！ ● から もういちど') : (miss === 2 ? '● から かきはじめるよ' : 'オレンジの てんせんを ヒントに かいてね');
      // かく：まちがえるたびに ヒントを ふやす（1回め：ことばだけ → 2回め：●を出す → 3回め：てんせん）
      if (!isTrace) { if (miss >= 2) { placeDot(); showDot(true); } if (miss >= 3) showHint(); }
      bubble(other >= 0 ? 'かきじゅんを もういちど みてみる？「みる」で たしかめられるよ' : 'だいじょうぶ、ゆっくりで いいよ');
    });
    placeDot(); showDot(isTrace);
    acts.innerHTML = `<button class="btn" id="wRe">🔄 さいしょから</button>` +
      (isTrace ? `<button class="btn" id="wNext">✍️ じぶんで かく</button>` : `<button class="btn" id="wModel">👀 ちょっとだけ みる</button>`);
    acts.querySelector('#wRe').onclick = () => setTab(kind);
    if (isTrace) acts.querySelector('#wNext').onclick = () => setTab('write');
    else acts.querySelector('#wModel').onclick = () => {
      // 1.5びょうだけ おてほんを うすく みせる
      const m = document.createElement('div'); m.style.cssText = 'position:absolute;inset:0;pointer-events:none'; m.innerHTML = strokeSvg(k, 'faint', { guide: false, nums: true });
      box.insertBefore(m, box.firstChild); setTimeout(() => m.remove(), 1500);
    };
  }

  function finish(isTrace) {
    sfx.clear();
    const praise = pick(PRAISE);
    msg.className = 'msg ok';
    if (isTrace) {
      title.textContent = 'なぞれたね！';
      msg.textContent = 'つぎは じぶんで かいて みよう';
      bubble(praise + ' つぎは みないで かけるかな？');
      tabs[2].classList.add('glow');
      const b = acts.querySelector('#wNext'); b.classList.add('main');
      if (!teacher()) speak(praise);
      return;
    }
    title.textContent = praise;
    // はなまる
    const r = document.createElement('div'); r.className = 'reward';
    // はなまる（まんなかの うずまき ＋ まわりの はなびら）
    const spiral = Array.from({ length: 60 }, (_, i) => { const a = i / 60 * Math.PI * 5.2, rr = 4 + i * 0.5; return `${(50 + rr * Math.cos(a)).toFixed(1)},${(50 + rr * Math.sin(a)).toFixed(1)}`; }).join(' ');
    const petals = Array.from({ length: 9 }, (_, i) => { const a = i / 9 * Math.PI * 2; return `<circle cx="${(50 + 36 * Math.cos(a)).toFixed(1)}" cy="${(50 + 36 * Math.sin(a)).toFixed(1)}" r="11"/>`; }).join('');
    r.innerHTML = `<svg class="hanamaru" viewBox="0 0 100 100"><g fill="none" stroke="#e8303f" stroke-width="2" stroke-linecap="round" opacity=".5">
      <polyline points="${spiral}"/>${petals}</g></svg>`;
    box.insertBefore(r, box.firstChild);  // 子どもの字の うしろに
    const first = !store.stamps[k];
    store.stamps[k] = (store.stamps[k] || 0) + 1; save();
    const dotBtn = view.querySelector(`.row-dots button[data-k="${k}"]`); if (dotBtn) dotBtn.classList.add('done');
    msg.textContent = first ? '🌸 スタンプ ゲット！' : `🌸 ${store.stamps[k]}かいめの はなまる！`;
    bubble(`「${k}」 かんせい！ はなまる だよ`);
    if (!teacher()) { speak(praise); confetti(); }
    const list = ROWS[S.row].ks.filter(Boolean), i = list.indexOf(k);
    const nextK = list[i + 1];
    const nextRow = S.row + 1 < ROWS.length ? S.row + 1 : -1;
    acts.innerHTML = `<button class="btn" id="wRe">🔄 もういちど かく</button>` +
      (nextK ? `<button class="btn main" id="wGo">つぎの 字「${nextK}」へ ▶</button>`
        : nextRow >= 0 ? `<button class="btn main" id="wGo">${ROWS[S.row].name} おわり！ ${ROWS[nextRow].name}へ ▶</button>`
        : `<button class="btn main" id="wGo">🔤 ひょうに もどる</button>`);
    acts.querySelector('#wRe').onclick = () => setTab('write');
    acts.querySelector('#wGo').onclick = () => nextK ? openChar(S.row, nextK) : nextRow >= 0 ? openChar(nextRow, ROWS[nextRow].ks[0]) : showTable();
  }

  function setTab(t) {
    stop(); S.tab = t; pad = null; msg.textContent = ''; msg.className = 'msg';
    tabs.forEach(b => b.classList.toggle('on', b.dataset.t === t));
    setURL({ ji: k, scene: t });
    if (t === 'see') see(); else practice(t);
  }
  tabs.forEach(b => b.onclick = () => setTab(b.dataset.t));
  setTab(firstTab);
}

function confetti() {
  const em = ['🌸', '⭐', '💖', '🎀', '✨'];
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('div'); s.className = 'confetti'; s.textContent = pick(em);
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDuration = 1.6 + Math.random() * 1.4 + 's'; s.style.animationDelay = Math.random() * .4 + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 3600);
  }
}

// ───────── なぞって えを けそう ─────────
// 画の 線に そって その字の 絵の シールを ならべ、書きじゅんどおりに なぞった ところだけ けす。
// 1字に 絵が 3まい（PICS）なので、同じ字を 3かい かく。さわっている あいだは 3びょうごとに「あひるの、あ」と なる
const voiceId = k => typeof VOICE !== 'undefined' && (VOICE[k] || VOICE[k.replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))]);
// 読み上げ（speak）と 同じく、ならす たびに <audio> を あたらしく 作る
// （まえに 作って おいた 音を あとで ならす やり方は、Chromebook で 鳴らないことが あった）
const traceVoice = { key: null, url: '', cur: null, last: -1e9 };
const VOICE_EVERY_MS = 3000;
function loadTraceVoice(k, word) {
  const key = k + '|' + word;
  if (traceVoice.key === key) return;
  stopTraceVoice();
  traceVoice.key = key; traceVoice.last = -1e9;
  // 「ことばの、字」の 声（voice-phrase）。ない ときは 字だけの 声
  const pid = typeof VOICE_PHRASE !== 'undefined' && VOICE_PHRASE[key], id = voiceId(k);
  traceVoice.url = pid ? 'hiragana/voice-phrase/' + pid + '.m4a' : id ? 'hiragana/voice/' + id + '.m4a' : '';
  if (traceVoice.url) try { fetch(traceVoice.url).catch(() => {}); } catch (e) {}   // さきに よみこんで おく
}
function stopTraceVoice() { if (traceVoice.cur) { traceVoice.cur.pause(); traceVoice.cur = null; } }
// さわりはじめに 1ど、さわりつづけていれば 3びょうごとに ならす（なっている とちゅうでは かさねない）。
// 読み上げと おなじく「おと」の オン・オフに かかわらず ならす
function traceSay() {
  if (!traceVoice.url) return;
  const now = performance.now(), c = traceVoice.cur;
  if (now - traceVoice.last < VOICE_EVERY_MS || (c && !c.paused && !c.ended)) return;
  traceVoice.last = now;
  try {
    if (voiceAudio) { voiceAudio.pause(); voiceAudio = null; }
    const a = new Audio(traceVoice.url);
    traceVoice.cur = a;
    a.play().catch(() => { if (traceVoice.cur === a) traceVoice.cur = null; });
  } catch (e) {}
}

function showErase(row, k, round = 0) {
  cleanup(); S.row = row; S.k = k; drawModeChip(); setURL({ ji: k });
  store.erase = store.erase || {};
  const words = PICS[k], word = words[round], ink = PENS[store.pen][0];
  loadTraceVoice(k, word);
  const list = ROWS[row].ks.filter(canErase);
  view.innerHTML = `
    <div class="row-dots">${list.map(c => `<button data-k="${c}" class="${c === k ? 'cur' : ''}${store.erase[c] ? ' done' : ''}">${c}</button>`).join('')}</div>
    <div class="er-rounds">${words.map((w, i) => `<span class="${i < round ? 'done' : i === round ? 'cur' : ''}"><img src="${picSrc(k, i)}" alt="${esc(w)}"></span>`).join('')}</div>
    <p class="wtitle" id="wtitle">● から なぞって「${esc(word)}」を けそう！</p>
    <div class="wbox erbox" id="wbox"></div>
    <p class="msg" id="msg"></p>
    <div class="acts" id="acts"><button class="btn" id="eRe">🔄 さいしょから</button><button class="btn" id="toTable">🔤 ひょうに もどる</button></div>`;
  const box = view.querySelector('#wbox'), msg = view.querySelector('#msg'), title = view.querySelector('#wtitle'), acts = view.querySelector('#acts');
  view.querySelectorAll('.row-dots button').forEach(b => b.onclick = () => showErase(row, b.dataset.k));
  view.querySelector('#eRe').onclick = () => showErase(row, k, round);
  view.querySelector('#toTable').onclick = showTable;
  const say = (t, cls) => { msg.className = 'msg ' + (cls || ''); msg.textContent = t; };

  // 字の 線（うすい）＋ なぞった 色の 線 ＋ 絵の シール
  box.innerHTML = strokeSvg(k, 'base');
  const svg = box.querySelector('svg');
  const paths = [...svg.querySelectorAll('path.stk')];
  const defs = document.createElementNS(SVGNS, 'defs');
  defs.innerHTML = '<clipPath id="erClip" clipPathUnits="objectBoundingBox"><circle cx=".5" cy=".5" r=".5"/></clipPath>';
  svg.appendChild(defs);
  const lens = paths.map(p => p.getTotalLength());
  const inks = paths.map((p, i) => { const q = p.cloneNode(); q.setAttribute('class', 'stk ink'); q.style.stroke = ink; q.style.strokeDasharray = `0 ${lens[i] + 1}`; q.style.display = 'none'; svg.appendChild(q); return q; });
  const R = 7, GAP = 7, src = picSrc(k, round);
  const stk = paths.map((p, si) => { const L = lens[si], n = Math.max(1, Math.round(L / GAP)); return Array.from({ length: n + 1 }, (_, i) => { const q = p.getPointAtLength(L * i / n); return { x: q.x, y: q.y, at: L * i / n }; }); });
  // はみ出しを しらべる ための こまかい 点
  const dense = paths.map((p, si) => { const L = lens[si], n = Math.max(2, Math.ceil(L)); return Array.from({ length: n + 1 }, (_, i) => { const q = p.getPointAtLength(L * i / n); return { x: q.x, y: q.y, at: L * i / n }; }); });
  const layer = document.createElementNS(SVGNS, 'g'); svg.appendChild(layer);
  // 1かくめ・なぞる じゅんの シールが うえに くるように、うしろから おく
  for (let si = stk.length - 1; si >= 0; si--) for (let i = stk[si].length - 1; i >= 0; i--) {
    const s = stk[si][i], g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('class', 'sticker');
    g.innerHTML = `<circle cx="${s.x}" cy="${s.y}" r="${R}"/><image href="${src}" x="${s.x - R}" y="${s.y - R}" width="${2 * R}" height="${2 * R}" clip-path="url(#erClip)"/>`;
    layer.appendChild(g); s.el = g;
  }
  const dot = document.createElementNS(SVGNS, 'circle'); dot.setAttribute('r', '3.2'); dot.setAttribute('class', 'startdot pulse'); dot.setAttribute('stroke', '#fff'); dot.setAttribute('stroke-width', '1.2'); svg.appendChild(dot);

  let cur = 0, idx = 0, busy = false, alive = true;
  const timers = [], later = (f, t) => timers.push(setTimeout(() => alive && f(), t));
  const dist = (p, s) => Math.hypot(p[0] - s.x, p[1] - s.y);
  const mark = () => stk.forEach((a, si) => a.forEach(s => s.el.classList.toggle('later', si > cur)));
  const place = () => { if (cur < stk.length) { const s = stk[cur][idx]; dot.setAttribute('cx', s.x); dot.setAttribute('cy', s.y); dot.style.display = ''; } else dot.style.display = 'none'; };
  const showInk = () => { const q = inks[cur]; q.style.display = ''; q.style.strokeDasharray = `${idx ? stk[cur][idx - 1].at : 0} ${lens[cur] + 1}`; };
  // いま なぞっている あたりの 線から どれだけ はなれているか
  const offBy = p => {
    const s = stk[cur], lo = s[Math.max(0, idx - 2)].at - 2, hi = s[Math.min(s.length - 1, idx + 1)].at + 2;
    return dense[cur].reduce((m, q) => q.at >= lo && q.at <= hi ? Math.min(m, dist(p, q)) : m, 1e9);
  };
  mark(); place();

  // 子どもの 指の あと（はなすと きえる）
  const cv = document.createElement('canvas'); box.appendChild(cv);
  const ctx = cv.getContext('2d');
  const fit = () => {
    const w = cv.clientWidth, h = cv.clientHeight, d = window.devicePixelRatio || 1;
    if (!w || !h || (cv.width === Math.round(w * d) && cv.height === Math.round(h * d))) return;
    cv.width = Math.round(w * d); cv.height = Math.round(h * d);
    ctx.setTransform(d, 0, 0, d, 0, 0); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = ink; ctx.globalAlpha = .55; ctx.lineWidth = Math.max(6, w / 40);
  };
  const wipe = () => ctx.clearRect(0, 0, cv.width, cv.height);
  fit();
  const ro = window.ResizeObserver ? new ResizeObserver(fit) : null; if (ro) ro.observe(cv);
  // さわっている あいだ 3びょうごとに 声（うごかさずに おさえていても なる）
  const tick = setInterval(() => { if (pid !== null && !busy) traceSay(); }, 200);
  cleanup = () => { alive = false; timers.forEach(clearTimeout); clearInterval(tick); if (ro) ro.disconnect(); stopTraceVoice(); };

  const at = e => { const b = cv.getBoundingClientRect(); const x = e.clientX - b.left, y = e.clientY - b.top; return [x / b.width * 109, y / b.height * 109, x, y]; };
  let pid = null, last = null, live = false, off = false, got = false, start = null;
  function eat(p) {
    while (cur < stk.length && idx < stk[cur].length && dist(p, stk[cur][idx]) < 9) {
      stk[cur][idx].el.classList.add('gone'); idx++; got = true;
    }
    if (idx >= stk[cur].length) strokeDone(); else { showInk(); place(); }
  }
  function strokeDone() {
    inks[cur].style.display = ''; inks[cur].style.strokeDasharray = 'none';
    sfx.stroke(); cur++; idx = 0; live = false; mark(); place();
    if (cur >= stk.length) roundDone();
    else say(`${cur}かくめ できた！ つぎは ● から`, 'ok');
  }
  cv.onpointerdown = e => {
    e.preventDefault();
    if (pid !== null || busy || cur >= stk.length) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    traceSay(); fit(); wipe(); pid = e.pointerId; try { cv.setPointerCapture(pid); } catch (x) {}
    const p = at(e); last = start = p; got = false; off = false;
    // ● の 近く（けした ところの おわりの ほうから でも よい）から はじめたら けせる
    live = dist(p, stk[cur][idx]) < 11 || (idx > 0 && offBy(p) < 9);
    ctx.beginPath(); ctx.moveTo(p[2], p[3]); ctx.lineTo(p[2], p[3]); ctx.stroke();
    if (live) eat(p);
  };
  cv.onpointermove = e => {
    if (e.pointerId !== pid) return;
    e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    for (const ev of (evs.length ? evs : [e])) {
      const p = at(ev);
      ctx.beginPath(); ctx.moveTo(last[2], last[3]); ctx.lineTo(p[2], p[3]); ctx.stroke(); last = p;
      if (!live || off || cur >= stk.length) continue;
      if (offBy(p) > 13) { off = true; sfx.miss(); say('せんから はみでたよ。● から つづけてね', 'try'); continue; }
      eat(p);
    }
  };
  const end = e => {
    if (pid === null || (e && e.pointerId !== pid)) return;
    pid = null; later(wipe, 250);
    if (busy || cur >= stk.length || off || got) { if (got && !off && cur < stk.length && idx > 0) say('いいね！ ● から つづけよう', 'ok'); return; }
    // なにも けせなかった ときの ひとこと
    const s = stk[cur], other = stk.findIndex((a, j) => j > cur && dist(start, a[0]) < 11);
    sfx.miss();
    if (idx === 0 && dist(start, s[s.length - 1]) < 11 && dist(last, s[0]) < 14) say('むきが はんたい だよ。● から なぞってね', 'try');
    else if (other >= 0) say(`それは ${other + 1}かくめ だよ。いまは ${cur + 1}かくめ！`, 'try');
    else say('みどりの ● から なぞってね', 'try');
  };
  cv.onpointerup = end; cv.onpointercancel = end; cv.onlostpointercapture = end;

  function roundDone() {
    busy = true; sfx.clear();
    title.textContent = pick(PRAISE);
    const win = document.createElement('div'); win.className = 'er-win';
    win.innerHTML = `<img src="${src}" alt=""><div class="w">${esc(word).replace(k, `<b>${k}</b>`)}</div>`;
    later(() => { box.appendChild(win); stopTraceVoice(); speak(word); }, 450);
    const last3 = round >= words.length - 1;
    if (!last3) {
      say(`「${word}」が きえたね！ もう いちど かこう`, 'ok');
      acts.innerHTML = `<button class="btn" id="toTable">🔤 ひょうに もどる</button><button class="btn main" id="eNext">つぎの え「${esc(words[round + 1])}」へ ▶</button>`;
      acts.querySelector('#eNext').onclick = () => showErase(row, k, round + 1);
    } else {
      const first = !store.erase[k];
      store.erase[k] = (store.erase[k] || 0) + 1; save();
      view.querySelector('.er-rounds span.cur').className = 'done';
      const dotBtn = view.querySelector(`.row-dots button[data-k="${k}"]`); if (dotBtn) dotBtn.classList.add('done');
      say(first ? `✨「${k}」の え、3まい ぜんぶ けせたね！` : `✨ ${store.erase[k]}かいめの クリア！`, 'ok');
      later(confetti, 450);
      const i = list.indexOf(k), nextK = list[i + 1];
      const nextRow = ROWS.findIndex((r, j) => j > row && r.ks.some(canErase));
      acts.innerHTML = `<button class="btn" id="eAgain">🔄 もういちど</button>` +
        `<button class="btn mint" id="eWrite">✍️ みないで かいて みよう</button>` +
        (nextK ? `<button class="btn main" id="eGo">つぎの 字「${nextK}」へ ▶</button>`
          : nextRow >= 0 ? `<button class="btn main" id="eGo">${ROWS[nextRow].name}へ ▶</button>`
          : `<button class="btn main" id="eGo">🔤 ひょうに もどる</button>`);
      acts.querySelector('#eAgain').onclick = () => showErase(row, k);
      acts.querySelector('#eWrite').onclick = () => { S.play = ''; openChar(row, k, 'write'); };
      acts.querySelector('#eGo').onclick = () => nextK ? showErase(row, nextK) : nextRow >= 0 ? showErase(nextRow, ROWS[nextRow].ks.find(canErase)) : showTable();
    }
    view.querySelector('#toTable') && (view.querySelector('#toTable').onclick = showTable);
  }
}

// ───────── ゲーム（ふうせん あなうめ・もじ ならべ） ─────────
// 絵（PICS）の ある ことばで あそぶ。1かい 10もん。1かいで せいかいすると ⭐
const G_LEVELS = [['easy', '⭐ かんたん'], ['mid', '⭐⭐ ふつう'], ['hard', '⭐⭐⭐ むずかしい']];
const G_N = 10;
// にている 字（むずかしい）
const LOOKALIKE = ['あおめぬ', 'ぬめ', 'ねれわ', 'さちき', 'るろ', 'はほけ', 'いりこ', 'くへし', 'まもほ', 'うつらち', 'たな', 'そろる', 'よま',
  'シツ', 'ソンリ', 'クケタ', 'ウワフ', 'コユロ', 'アマ', 'チテナ', 'ヌスフ', 'ノメソ', 'ルレ', 'ハヘト', 'ヲテ', 'オネ', 'ーニ'];
const toChars = w => [...w.replace(/\s+/g, '')];
// 濁点・半濁点・小さい字の なかま（は→ば・ぱ、や→ゃ）
function kin(k) {
  const base = k.normalize('NFD')[0], out = [base, (base + '゙').normalize('NFC'), (base + '゚').normalize('NFC')];
  if (SMALL.includes(k)) out.push(String.fromCharCode(k.charCodeAt(0) + 1));
  const sm = String.fromCharCode(k.charCodeAt(0) - 1); if (SMALL.includes(sm)) out.push(sm);
  return out.filter(c => [...c].length === 1);
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
// まちがいの 字を n こ えらぶ（ans と word に ある字は のぞく）
function decoys(ans, n, level, avoid) {
  const set = KANA[kanaOf(ans) || S.kana], plain = set.all.filter(c => !SMALL.includes(c) && c !== 'ー' && c.normalize('NFD').length === 1);
  const row = (set.rows.find(r => r.ks.includes(ans)) || { ks: [] }).ks.filter(Boolean);
  const near = [...new Set([...kin(ans), ...LOOKALIKE.filter(g => g.includes(ans)).join('')])];
  const pools = level === 'hard' ? [near, row, plain] : level === 'mid' ? [row, kin(ans), plain] : [plain];
  const out = [], ng = new Set([ans, ...(avoid || [])]);
  pools.forEach(p => shuffle(p).forEach(c => { if (out.length < n && set.all.includes(c) && !ng.has(c)) { out.push(c); ng.add(c); } }));
  return out;
}
// ひらがなの 絵の うち、ほんとうは カタカナで 書く ことば（カタカナの ゲームにも 出す）
const KATA_FROM_HIRA = [['ぱんだ', 'パンダ'], ['らいおん', 'ライオン'], ['ぱじゃま', 'パジャマ'], ['らっぱ', 'ラッパ']];
function gRangeKs(range) {
  if (range === 'all') return ALL;
  if (range === 'done') return ALL.filter(k => store.stamps[k]);
  const r = ROWS[+range]; return r ? r.ks.filter(Boolean) : ALL;
}
function gPool(type, range, level) {
  const maxLen = type === 'narabe' ? { easy: 3, mid: 5, hard: 99 }[level] : 99;
  const items = [];
  const ks = gRangeKs(range);
  ks.forEach(k => (PICS[k] || []).forEach((w, n) => { if (toChars(w).length <= maxLen) items.push({ k, w, src: picSrc(k, n) }); }));
  KATA_FROM_HIRA.forEach(([hw, w]) => {
    const hk = Object.keys(PICS).find(x => PICS[x].includes(hw)); if (!hk || toChars(w).length > maxLen) return;
    const src = picSrc(hk, PICS[hk].indexOf(hw));
    [...new Set(w)].forEach(k => { if (ks.includes(k)) items.push({ k, w, src }); });
  });
  // 同じ ことばは 1かいだけ
  const seen = new Set();
  return shuffle(items).filter(it => !seen.has(it.w) && seen.add(it.w)).slice(0, G_N);
}

function showGameMenu() {
  cleanup(); drawModeChip(); setURL({ game: 1 });
  const set = KANA[S.kana], g = Object.assign({ range: 'all', level: 'easy' }, store.game);
  if (g.range !== 'all' && g.range !== 'done' && !ROWS[+g.range]) g.range = 'all';
  const nDone = ALL.filter(k => store.stamps[k] && PICS[k]).length;
  view.innerHTML = `
    <div class="kanatabs">${Object.entries(KANA).map(([id, k]) => `<button class="ktab${id === S.kana ? ' on' : ''}" data-kana="${id}">${k.label}</button>`).join('')}</div>
    <h1>🎈 ことば ゲーム<small>えを みて、${set.label}の ことばを つくろう</small></h1>
    <div class="g-opts">
      <label class="g-opt">どの 字で？
        <select id="gRange">
          <option value="all">${set.label} ぜんぶ</option>
          <option value="done"${nDone ? '' : ' disabled'}>🌸 かけた 字${nDone ? `（${nDone}こ）` : '（まだ ないよ）'}</option>
          ${ROWS.map((r, i) => r.ks.some(k => PICS[k]) ? `<option value="${i}">${r.name}</option>` : '').join('')}
        </select></label>
      <div class="g-opt">${G_LEVELS.map(([id, t]) => `<button class="lv${g.level === id ? ' on' : ''}" data-lv="${id}">${t}</button>`).join('')}</div>
    </div>
    <div class="start-modes">
      <button class="bigmode fs" data-g="fusen"><span class="ic">🎈</span>ふうせん あなうめ<small>あいている ところに はいる<br>字の ふうせんを えらぼう</small></button>
      <button class="bigmode nb" data-g="narabe"><span class="ic">🧩</span>もじ ならべ<small>えに あう ように<br>字を じゅんばんに ならべよう</small></button>
    </div>
    <div class="acts"><button class="btn" id="toTable">🔤 ひょうに もどる</button></div>`;
  const sel = view.querySelector('#gRange'); sel.value = g.range; if (sel.value !== g.range) sel.value = 'all';
  const keep = () => { store.game = { range: sel.value, level: g.level }; save(); };
  sel.onchange = keep;
  view.querySelectorAll('.lv').forEach(b => b.onclick = () => { g.level = b.dataset.lv; keep(); view.querySelectorAll('.lv').forEach(x => x.classList.toggle('on', x === b)); });
  view.querySelectorAll('.ktab').forEach(b => b.onclick = () => { setKana(b.dataset.kana); showGameMenu(); });
  view.querySelector('#toTable').onclick = showTable;
  view.querySelectorAll('.bigmode').forEach(b => b.onclick = () => { keep(); playGame(b.dataset.g, sel.value, g.level); });
}

function playGame(type, range, level) {
  const qs = gPool(type, range, level);
  if (!qs.length) { alert('この えらびかたでは もんだいが つくれないよ。ほかの 字を えらんでね'); return; }
  const marks = [];  // ⭐＝1かいで せいかい ／ ✔＝せいかい
  let qi = 0, alive = true;
  const timers = [];
  const later = (f, ms) => timers.push(setTimeout(() => alive && f(), ms));
  cleanup = () => { alive = false; timers.forEach(clearTimeout); };
  setURL({ game: type });

  function frame(q) {
    view.innerHTML = `
      <div class="g-head">
        <div class="g-dots">${qs.map((_, i) => `<span class="${i === qi ? 'cur' : ''}">${marks[i] || ''}</span>`).join('')}</div>
        <button class="btn" id="gQuit">✖ やめる</button>
      </div>
      <div class="g-word" id="gWord"></div>
      <div class="g-board"><img src="${q.src}" alt="${esc(q.w)}"><button class="say" id="gSay" aria-label="よむ">🔊</button></div>
      <div id="gPlay"></div>`;
    view.querySelector('#gQuit').onclick = showGameMenu;
    view.querySelector('#gSay').onclick = () => speak(q.w);
    if (!teacher()) later(() => speak(q.w), 300);
  }
  function correct(q, miss) {
    marks[qi] = miss ? '✔' : '⭐';
    sfx.clear();
    const ok = document.createElement('div'); ok.className = 'ok';
    view.querySelector('.g-board').appendChild(ok);
    const d = view.querySelectorAll('.g-dots span')[qi]; if (d) d.textContent = marks[qi];
    if (!teacher()) later(() => speak(q.w), 350);
    later(() => { qi++; qi < qs.length ? ask() : result(); }, teacher() ? 1500 : 2100);
  }

  // 🎈 ふうせん あなうめ
  function fusen(q) {
    frame(q);
    const chars = [...q.w], hole = chars.indexOf(q.k);
    view.querySelector('#gWord').innerHTML = chars.map((c, i) => c === ' ' ? '<span class="sp"></span>'
      : i === hole ? '<span class="hole" id="gHole"></span>' : `<span class="ch">${esc(c)}</span>`).join('');
    const cs = shuffle([q.k, ...decoys(q.k, 4, level, chars)]);
    const colors = ['#ff9aa8', '#8ecdf5', '#9be0c4', '#ffd96b', '#ffb37a', '#c9a8f0'];
    const ys = ['34px', '10px', '0px', '10px', '34px'];
    view.querySelector('#gPlay').innerHTML = `<div class="g-bals">${cs.map((c, i) =>
      `<button class="bal" data-c="${c}" style="--bc:${colors[i % colors.length]};--y:${ys[i] || 0};--d:${(i * .37).toFixed(2)}s">${c}</button>`).join('')}</div>`;
    let miss = 0, done = false;
    view.querySelectorAll('.bal').forEach(b => b.onclick = () => {
      if (done) return;
      if (b.dataset.c !== q.k) {
        miss++; sfx.miss(); b.classList.add('popped');
        if (miss >= 2 && !teacher()) { const r = view.querySelector(`.bal[data-c="${q.k}"]`); if (r) r.classList.add('glow'); }
        if (!teacher()) later(() => speak(q.w), 300);
        return;
      }
      done = true;
      const h = view.querySelector('#gHole').getBoundingClientRect(), r = b.getBoundingClientRect();
      b.classList.remove('glow'); b.classList.add('fly');
      b.style.transform = `translate(${h.left + h.width / 2 - r.left - r.width / 2}px, ${h.top + h.height / 2 - r.top - r.height / 2}px) scale(.8)`;
      b.style.opacity = '0';
      later(() => { const hl = view.querySelector('#gHole'); hl.classList.add('fill'); hl.innerHTML = `<b>${esc(q.k)}</b>`; correct(q, miss); }, 550);
    });
  }

  // 🧩 もじ ならべ
  function narabe(q) {
    frame(q);
    const chars = toChars(q.w), extra = { easy: 0, mid: 2, hard: 3 }[level];
    const bad = [];
    shuffle([...new Set(chars)].filter(c => c !== 'ー')).forEach(c => bad.push(...decoys(c, 1, level === 'easy' ? 'mid' : level, [...chars, ...bad])));
    const tiles = shuffle([...chars, ...bad.slice(0, extra)]);
    const word = view.querySelector('#gWord');
    word.innerHTML = chars.map((_, i) => `<span class="box${i ? '' : ' next'}"></span>`).join('');
    view.querySelector('#gPlay').innerHTML = `<div class="g-tiles">${tiles.map(c => `<button class="tile" data-c="${c}">${c}</button>`).join('')}</div>`;
    const boxes = word.querySelectorAll('.box');
    let at = 0, miss = 0, slotMiss = 0;
    const hint = () => { const t = [...view.querySelectorAll('.tile:not(.used)')].find(x => x.dataset.c === chars[at]); if (t) t.classList.add('glow'); };
    view.querySelectorAll('.tile').forEach(t => t.onclick = () => {
      if (at >= chars.length || t.classList.contains('used')) return;
      if (t.dataset.c !== chars[at]) {
        miss++; slotMiss++; sfx.miss();
        t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake');
        if (slotMiss >= 2 && !teacher()) hint();
        return;
      }
      view.querySelectorAll('.tile.glow').forEach(x => x.classList.remove('glow'));
      t.classList.add('used'); sfx.stroke();
      boxes[at].classList.remove('next'); boxes[at].innerHTML = `<b>${esc(t.dataset.c)}</b>`;
      at++; slotMiss = 0;
      if (at < chars.length) boxes[at].classList.add('next'); else correct(q, miss);
    });
  }

  function ask() { (type === 'fusen' ? fusen : narabe)(qs[qi]); }
  function result() {
    const stars = marks.filter(m => m === '⭐').length;
    const msg = stars === qs.length ? 'ぜんぶ いっぱつ せいかい！ すごい！' : stars >= qs.length * .7 ? 'よく できたね！' : 'さいごまで がんばったね！';
    setURL({ game: type });
    view.innerHTML = `
      <div class="mascot">${stars === qs.length ? '🏆' : '🐰'}</div>
      <h1>${msg}</h1>
      <div class="g-result"><div class="stars">${marks.join('')}</div>${qs.length}もん ちゅう、⭐ いっぱつ せいかい ${stars}もん</div>
      <div class="acts">
        <button class="btn main" id="gAgain">🔄 もういちど</button>
        <button class="btn" id="gMenu">🎈 ゲームを えらぶ</button>
        <button class="btn" id="toTable">🔤 ひょうに もどる</button>
      </div>`;
    sfx.clear(); if (!teacher()) { confetti(); speak(stars === qs.length ? 'すごい' : 'よくできました'); }
    view.querySelector('#gAgain').onclick = () => playGame(type, range, level);
    view.querySelector('#gMenu').onclick = showGameMenu;
    view.querySelector('#toTable').onclick = showTable;
  }
  ask();
}

// ───────── プリント ─────────
function printSheet(which) {
  const ks = which === 'all' ? ALL : ROWS[+which].ks.filter(Boolean);
  const guide = '<line class="guide" x1="54.5" y1="0" x2="54.5" y2="109"/><line class="guide" x1="0" y1="54.5" x2="109" y2="54.5"/>';
  const box = inner => `<div class="p-box">${inner}</div>`;
  document.getElementById('print').innerHTML = `
    <div class="p-head"><b>ひらがな なぞりっこ　${which === 'all' ? KANA[S.kana].label : ROWS[+which].name}</b><span>　がつ　　にち　　なまえ（　　　　　　　　　）</span></div>
    ${ks.map(k => `<div class="p-row">
      <div class="p-info"><div class="e">${PICS[k] ? `<img src="${picSrc(k, picNo[k] || 0)}" alt="">` : WORDS[k] ? WORDS[k][0] : ''}</div><div>${esc(picWord(k))}</div></div>
      ${box(strokeSvg(k, 'ink', { nums: true }))}
      ${box(strokeSvg(k, 'trace'))}${box(strokeSvg(k, 'trace'))}${box(strokeSvg(k, 'trace'))}
      ${box(`<svg viewBox="0 0 109 109" xmlns="${SVGNS}">${guide}</svg>`)}${box(`<svg viewBox="0 0 109 109" xmlns="${SVGNS}">${guide}</svg>`)}
    </div>`).join('')}
    <div class="p-foot">ひだりはしは おてほん（あかい すうじが かきじゅん）、うすい字は なぞりがき、しろい ますは じぶんで かく れんしゅうです。　書きじゅんのデータ：KanjiVG（CC BY-SA 3.0）</div>`;
  window.print();
}

// ───────── はじめる ─────────
drawSoundBtn();
(function boot() {
  const ji = Q.get('ji'), scene = Q.get('scene');
  if (KANA[Q.get('kana')]) setKana(Q.get('kana'));
  if (ji && kanaOf(ji)) setKana(kanaOf(ji));
  if (!S.mode) { showStart(); return; }
  if (erase()) { S.mode = 'student'; if (ji && canErase(ji) && rowOf(ji) >= 0) showErase(rowOf(ji), ji); else showTable(); }
  else if (Q.get('game')) showGameMenu();
  else if (ji && STROKES[ji] && rowOf(ji) >= 0) openChar(rowOf(ji), ji, ['see', 'trace', 'write'].includes(scene) ? scene : 'see');
  else if (Q.get('gyo')) { const r = ROWS.findIndex(x => x.name.startsWith(Q.get('gyo'))); if (r >= 0) openChar(r, ROWS[r].ks[0]); else showTable(); }
  else showTable();
})();
</script>
