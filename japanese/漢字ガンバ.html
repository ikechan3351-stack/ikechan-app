<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字ガンバ</title>
<style>
  :root {
    --sky: #8ecdf5; --sky-d: #3a8fd0; --navy: #1f3a6b; --card: #fff;
    --ok: #2e9e5b; --ok-bg: #e3f6ea; --hint: #fff4cc; --orange: #f08a34;
    --ui: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    --kj: "UD デジタル 教科書体 N-R", "UD Digi Kyokasho N-R", "UDDigiKyokashoN-R", "YuKyokasho", "Klee", "Hiragino Sans", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--sky); color: var(--navy);
    font-family: var(--ui); display: flex; flex-direction: column; align-items: center;
    -webkit-tap-highlight-color: transparent;
  }
  button { font-family: var(--ui); color: var(--navy); cursor: pointer; touch-action: manipulation; }
  .top {
    width: 100%; max-width: 980px; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px 4px; font-weight: bold; color: #fff; gap: 8px;
  }
  .top a, .top button.link { color: #fff; text-decoration: none; background: none; border: none; font-size: 1rem; font-weight: bold; padding: 6px 0; }
  .top .pos { font-size: 1.05rem; }
  .wrap { width: 100%; max-width: 980px; padding: 6px 16px 16px; flex: 1; display: flex; flex-direction: column; }
  .card {
    background: var(--card); border-radius: 22px; padding: 20px 18px; flex: 1;
    box-shadow: 0 4px 14px rgba(20, 60, 110, .18); display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  h1 { margin: 4px 0 0; font-size: 2.3rem; letter-spacing: .1em; }
  h1 .g { color: var(--orange); }
  .lead { margin: 0; font-size: 1.15rem; font-weight: bold; text-align: center; }
  .sub { margin: 0; font-size: .92rem; color: #4d6488; text-align: center; line-height: 1.6; }

  /* はじめの画面 */
  .modes { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .mode {
    border: 3px solid var(--sky-d); background: #fff; border-radius: 16px; padding: 10px 18px;
    font-size: 1.05rem; font-weight: bold;
  }
  .mode.on { background: var(--sky-d); color: #fff; }
  .grade { font-size: 1.3rem; padding: 8px 22px; }
  .grade small { display: block; font-size: .8rem; font-weight: normal; }
  .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; width: 100%; }
  .grp {
    border: none; border-radius: 16px; background: linear-gradient(135deg, #6bb6ec, var(--sky-d));
    color: #fff; padding: 10px 8px; box-shadow: 0 3px 0 #2a6ea6; text-align: center;
  }
  .grp .no { font-size: .8rem; opacity: .9; }
  .grp .ks { font-family: var(--kj); font-size: 1.7rem; letter-spacing: .08em; display: block; }
  .grp .ks.six { font-size: 1.45rem; letter-spacing: 0; }  /* 6字のまとまり（4年・5年・6年）を1行に */
  .grp:active { transform: translateY(2px); box-shadow: 0 1px 0 #2a6ea6; }
  /* 教科書の単元ごと */
  .bys .mode { font-size: .98rem; padding: 7px 14px; }
  .bys .mode:disabled { opacity: .45; }
  .by-note { margin: -6px 0 0; font-size: .85rem; color: #4d6488; text-align: center; }
  .term { margin: 4px 0 -4px; align-self: flex-start; font-size: 1.05rem; color: #2a6ea6; border-left: 6px solid var(--sky-d); padding-left: 8px; }
  .groups.units { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .grp .un { display: block; font-size: .95rem; font-weight: bold; line-height: 1.3; }
  .units .grp .ks { font-size: 1.4rem; letter-spacing: 0; white-space: nowrap; }  /* 10字まで1行に */
  .units .grp { background: linear-gradient(135deg, #7cc48a, #3e9a55); box-shadow: 0 3px 0 #2c7440; }
  .pick-toggle { border: 2px dashed var(--sky-d); background: #f3f9ff; border-radius: 14px; padding: 8px 16px; font-size: 1rem; font-weight: bold; }
  .picker { display: none; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  .picker.open { display: flex; }
  .kgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 6px; width: 100%; }
  .kbtn { font-family: var(--kj); font-size: 1.7rem; border: 2px solid #bcd7ef; background: #fff; border-radius: 12px; padding: 4px 0; }
  .kbtn.on { background: #ffe3c7; border-color: var(--orange); }
  .go { border: none; border-radius: 999px; background: var(--orange); color: #fff; font-size: 1.15rem; font-weight: bold; padding: 12px 34px; box-shadow: 0 3px 0 #c86a1e; }
  .go:disabled { opacity: .4; }

  /* どうやる？ */
  .robo { font-size: 3rem; line-height: 1; }
  .menu { width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .all {
    border: none; border-radius: 16px; background: linear-gradient(90deg, #f39a4e, #e9772a); color: #fff;
    display: flex; align-items: center; gap: 14px; padding: 14px 18px; text-align: left; box-shadow: 0 3px 0 #c45f1a;
  }
  .all .ic { font-size: 1.7rem; }
  .all b { font-size: 1.2rem; display: block; }
  .all small { opacity: .95; }
  .or { text-align: center; color: #5a86b5; font-weight: bold; font-size: .95rem; }
  .step {
    border: none; border-radius: 16px; background: linear-gradient(90deg, #6bb6ec, #4a9ad6); color: #fff;
    display: flex; align-items: center; gap: 14px; padding: 10px 16px; text-align: left; box-shadow: 0 3px 0 #2f78b3;
  }
  .step .n { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.3); display: flex; align-items: center; justify-content: center; font-size: 1.25rem; font-weight: bold; flex-shrink: 0; }
  .step b { font-size: 1.1rem; display: block; }
  .step small { opacity: .95; }
  .step.card-btn { background: linear-gradient(90deg, #7fcf9a, #4fb276); box-shadow: 0 3px 0 #33885a; }
  .step:disabled { background: #b9c6d3; box-shadow: none; cursor: default; }
  .chosen { font-family: var(--kj); font-size: 1.6rem; letter-spacing: .15em; }

  /* もんだい */
  .q-title { font-size: 1.15rem; font-weight: bold; margin: 0; text-align: center; }
  .stage { display: flex; align-items: center; justify-content: center; gap: 26px; flex-wrap: wrap; min-height: 150px; }
  .big { font-family: var(--kj); font-size: 6.5rem; line-height: 1.1; }
  .word { font-family: var(--kj); font-size: 4.6rem; line-height: 1.2; border: 4px solid var(--navy); border-radius: 18px; padding: 4px 30px; }
  .yomi { font-size: 3.4rem; font-weight: bold; letter-spacing: .12em; border: 4px solid var(--navy); border-radius: 18px; padding: 6px 26px; }
  .say { border: none; background: var(--sky); border-radius: 999px; padding: 8px 20px; font-size: 1.05rem; font-weight: bold; color: var(--navy); }
  .choices { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; width: 100%; }
  .ch {
    border: 4px solid #9fd0f3; background: #fff; border-radius: 18px; min-width: 120px; padding: 8px 18px;
    font-family: var(--kj); font-size: 3.6rem; line-height: 1.3; transition: transform .1s, opacity .3s;
  }
  .ch.wordch { font-size: 2.6rem; }
  .ch.picch { padding: 8px; }
  .ch:active { transform: scale(.96); }
  .ch.sel { border-color: var(--orange); background: #fff3e6; }
  .ch.ok { border-color: var(--ok); background: var(--ok-bg); }
  .ch.dim { opacity: .3; pointer-events: none; }
  .ch.hint { animation: glow 1s ease-in-out 3; border-color: #f0c419; }
  .ch.shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
  @keyframes glow { 50% { box-shadow: 0 0 0 8px var(--hint); } }

  .pic { width: 150px; height: 150px; border-radius: 14px; background: #f4f9ff; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .pic img { width: 100%; height: 100%; object-fit: contain; display: none; }
  .pic .emo { font-size: 5rem; line-height: 1; }
  .pic.lg { width: 210px; height: 210px; }
  .pic.lg .emo { font-size: 7rem; }

  .slots { display: flex; gap: 8px; justify-content: center; }
  .slot { width: 70px; height: 78px; border-bottom: 5px solid var(--navy); font-size: 3rem; font-weight: bold; display: flex; align-items: center; justify-content: center; }
  .slot.cur { background: #fff7d6; border-radius: 10px 10px 0 0; }
  .slot.ok { color: var(--ok); }
  .tiles { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .tile { width: 74px; height: 74px; border: 3px solid #9fd0f3; background: #fff; border-radius: 16px; font-size: 2.4rem; font-weight: bold; }
  .tile.used { visibility: hidden; }
  .tile.shake { animation: shake .35s; }
  .tile.hint { animation: glow 1s ease-in-out 3; border-color: #f0c419; }

  .msg { min-height: 2.4rem; font-size: 1.5rem; font-weight: bold; color: var(--ok); text-align: center; }
  .msg.try { color: #c27b00; }
  .acts { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn { border: none; border-radius: 999px; padding: 11px 26px; font-size: 1.1rem; font-weight: bold; background: #e6f2fc; }
  .btn.main { background: var(--orange); color: #fff; box-shadow: 0 3px 0 #c86a1e; }
  .btn.ans { background: #ffe08a; }
  .hidden { display: none !important; }

  .navi { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: auto; gap: 8px; }
  .arrow { border: none; background: none; font-size: 2.1rem; color: var(--sky-d); padding: 0 8px; }
  .arrow:disabled { opacity: .25; }
  .dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #cfe4f6; }
  .dot.on { background: var(--navy); }
  .dot.done { background: #8ccfa6; }

  /* カード */
  .kcard { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; width: 100%; }
  .kcard .left { background: #f2f6fa; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { border-radius: 14px; overflow: hidden; background: #f2f6fa; margin-bottom: 10px; }
  .box h3 { margin: 0; background: #6a95cf; color: #fff; font-size: .95rem; padding: 6px 12px; }
  .box .in { padding: 10px 12px; font-size: 1.25rem; line-height: 1.7; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tag { font-size: .8rem; color: #fff; border-radius: 999px; padding: 2px 10px; font-weight: bold; }
  .tag.on { background: #e8954a; } .tag.kun { background: #4fae6a; }
  .sp { border: none; background: #4a90d9; color: #fff; width: 44px; height: 44px; border-radius: 50%; font-size: 1.2rem; flex-shrink: 0; }

  .done-big { font-size: 5rem; }

  /* 画面の大きさに合わせて大きくする（Chromebook でも 画面いっぱいに） */
  .top { max-width: 1600px; padding: 6px 16px 2px; }
  .wrap { max-width: 1600px; padding: 4px 16px 10px; }
  body:has(.choices .picch) { height: 100vh; height: 100dvh; }  /* 絵のもんだいは 1画面に おさめる */
  .wrap { min-height: 0; }
  .card { padding: 14px 18px; gap: 10px; min-height: 0; }
  .stage { min-height: 0; }
  .msg { min-height: 1.6em; }
  /* 絵をえらぶもんだい：のこりの高さいっぱいに絵を広げる */
  .choices:has(.picch) { flex: 1 1 0; min-height: 150px; container-type: size; align-items: center; }
  .choices:has(.picch) .pic { width: min(calc(100cqh - 24px), 28vw, 380px); height: min(calc(100cqh - 24px), 28vw, 380px); }
  .q-title { font-size: clamp(1.15rem, 3.2vh, 1.8rem); }
  .big { font-size: clamp(6.5rem, 30vh, 16rem); line-height: 1.05; }
  .word { font-size: clamp(4.6rem, 15vh, 9rem); }
  .yomi { font-size: clamp(3.4rem, 11vh, 6.5rem); }
  .say { font-size: clamp(1.05rem, 2.8vh, 1.6rem); padding: .5em 1.2em; }
  .choices { gap: clamp(16px, 2.5vw, 36px); }
  .ch { font-size: clamp(3.6rem, 14vh, 8rem); min-width: clamp(120px, 12vw, 200px); }
  .ch.wordch { font-size: clamp(2.6rem, 8.5vh, 5rem); }
  .pic { width: clamp(150px, min(38vh, 24vw), 360px); height: clamp(150px, min(38vh, 24vw), 360px); }
  .pic .emo { font-size: clamp(5rem, 22vh, 11rem); }
  .pic.lg { width: clamp(210px, min(46vh, 32vw), 440px); height: clamp(210px, min(46vh, 32vw), 440px); }
  .pic.lg .emo { font-size: clamp(7rem, 28vh, 14rem); }
  .slot { width: clamp(70px, 12vh, 120px); height: clamp(78px, 13vh, 130px); font-size: clamp(3rem, 9vh, 5rem); }
  .tile { width: clamp(74px, 12vh, 120px); height: clamp(74px, 12vh, 120px); font-size: clamp(2.4rem, 7vh, 4rem); }
  .msg { font-size: clamp(1.5rem, 4vh, 2.4rem); }

  /* 先生モード（電子黒板）：さらに大きく */
  body.teacher .big { font-size: clamp(10rem, 34vh, 20rem); }
  body.teacher .word { font-size: clamp(7rem, 18vh, 11rem); }
  body.teacher .yomi { font-size: clamp(5rem, 13vh, 8rem); }
  body.teacher .ch { font-size: clamp(5rem, 15vh, 9rem); min-width: 160px; }
  body.teacher .ch.wordch { font-size: clamp(3.6rem, 9vh, 5.5rem); }
  body.teacher .pic { width: clamp(210px, min(40vh, 26vw), 420px); height: clamp(210px, min(40vh, 26vw), 420px); }
  body.teacher .pic .emo { font-size: 7rem; }
  body.teacher .pic.lg { width: clamp(280px, min(48vh, 34vw), 500px); height: clamp(280px, min(48vh, 34vw), 500px); }
  body.teacher .pic.lg .emo { font-size: 9.5rem; }
  body.teacher .slot { width: 96px; height: 106px; font-size: 4.2rem; }
  body.teacher .tile { width: 96px; height: 96px; font-size: 3.4rem; }
  body.teacher .q-title { font-size: clamp(1.6rem, 3.6vh, 2.2rem); }

  /* かく */
  .tabs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .tab { border: 3px solid #9fd0f3; background: #fff; border-radius: 999px; padding: 7px 18px; font-size: 1.05rem; font-weight: bold; }
  .tab.on { background: var(--sky-d); border-color: var(--sky-d); color: #fff; }
  .tab.glow { animation: glow 1s ease-in-out infinite; }
  .wbox { position: relative; width: 340px; height: 340px; max-width: 86vw; max-height: 86vw; border: 4px solid var(--navy); border-radius: 12px; background: #fffef8; touch-action: none; }
  .wbox svg, .wbox canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .wbox canvas { cursor: crosshair; }
  .wbox .guide { stroke: #d9c9a3; stroke-width: .6; stroke-dasharray: 2 2; }
  .stk { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .stk.base { stroke: #e3e3e3; stroke-width: 7; }
  .stk.ink { stroke: var(--navy); stroke-width: 5; }
  .stk.next { stroke: #ffcf99; stroke-width: 7; }
  .stk.faint { stroke: #c8d6e6; stroke-width: 5; }
  .snum { font-size: 7px; fill: #d0452f; font-family: var(--ui); font-weight: bold; }
  .startdot { fill: #2e9e5b; }
  .wbox { width: clamp(340px, 46vh, 560px); height: clamp(340px, 46vh, 560px); }
  body.teacher .wbox { width: clamp(470px, 52vh, 640px); height: clamp(470px, 52vh, 640px); }
  .nigate { width: 100%; border: 3px solid #f6c48d; background: #fff7ec; border-radius: 16px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .nigate .ks { font-family: var(--kj); font-size: 1.6rem; letter-spacing: .12em; }
  .mini { border: none; background: none; color: #8a6d4c; font-size: .85rem; text-decoration: underline; }

  /* 単元テスト */
  .step.test-btn { background: linear-gradient(90deg, #f6a95b, #ec8a3a); box-shadow: 0 3px 0 #b8611f; }
  .tsent { font-family: var(--kj); font-size: clamp(2rem, 6vh, 3.4rem); line-height: 1.9; text-align: center; padding: 10px 18px; background: #fffef8; border-radius: 16px; border: 3px solid #e4ecf4; }
  .tsent .tk { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 8px; color: #c0392b; }
  .tsent .ty { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 8px; color: #c0392b; position: relative; }
  .tsent .ty.shown::after { content: attr(data-kj); position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); font-size: .7em; line-height: 1; color: var(--ok); background: var(--ok-bg); border-radius: 8px; padding: 2px 8px; white-space: nowrap; }
  .tboxes { display: flex; gap: 14px; justify-content: center; }
  .wbox.tbox { width: clamp(240px, 36vh, 420px); height: clamp(240px, 36vh, 420px); }
  .tbox .tmodel { position: absolute; inset: 0; pointer-events: none; }
  .tbox .tmodel svg { width: 100%; height: 100%; }
  .slot.ng { background: #fde3e0; border-color: #e0685a; }
  .tprog { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
  .tprog span { width: 14px; height: 14px; border-radius: 50%; background: #d5e2ee; }
  .tprog span.gap { margin-left: 14px; }
  .tprog span.on { background: var(--sky-d); transform: scale(1.3); }
  .tprog span.ok { background: var(--ok); } .tprog span.ng { background: #e0685a; }
  .tscore { font-size: 1.6rem; font-weight: bold; } .tscore b { font-size: 4.5rem; color: #e0702a; }
  /* プリント（いんさつのときだけ出す） */
  #print { display: none; }
  @media print {
    @page { size: A4 portrait; margin: 12mm; }
    body { background: #fff; display: block; }
    .top, .wrap, .credit { display: none !important; }
    #print { display: block; color: #000; font-family: var(--ui); }
    .p-head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #000; padding-bottom: 4px; margin-bottom: 6mm; }
    .p-head b { font-size: 16pt; }
    .p-row { display: flex; align-items: center; gap: 2mm; margin-bottom: 5mm; break-inside: avoid; }
    .p-info { width: 22mm; text-align: center; font-size: 9pt; line-height: 1.4; }
    .p-box { width: 24mm; height: 24mm; border: 1.2px solid #000; position: relative; flex-shrink: 0; }
    .p-box svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .p-box .guide { stroke: #999; stroke-width: .5; stroke-dasharray: 2 2; }
    .p-box .stk.ink { stroke: #000; stroke-width: 4; }
    .p-box .stk.trace { stroke: #bbb; stroke-width: 4; }
    .p-box .snum { fill: #c00; font-size: 9.5px; }
    .p-foot { font-size: 7pt; color: #555; margin-top: 4mm; }
    .t-page + .t-page { break-before: page; }
    .t-score { text-align: right; font-size: 12pt; margin: -3mm 0 1mm; } .t-score span { display: inline-block; width: 22mm; height: 10mm; border: 1.5px solid #000; border-radius: 3mm; vertical-align: middle; margin-right: 2mm; }
    .t-page h4 { font-size: 12pt; margin: 3mm 0 2mm; }
    .t-grid { display: grid; grid-auto-flow: column; grid-template-columns: 1fr 1fr; column-gap: 6mm; }
    .t-item { display: flex; align-items: flex-end; gap: 2mm; padding: 1.5mm 0 2.5mm; border-bottom: .5px dashed #bbb; break-inside: avoid; }
    .t-no { font-size: 10pt; padding-bottom: 1.5mm; }
    .t-s { font-family: var(--kj); font-size: 14pt; line-height: 1.3; }
    .t-r { display: inline-flex; flex-direction: column; align-items: center; vertical-align: bottom; margin: 0 1mm; }
    .t-blank { display: block; height: 7.5mm; border: 1.2px solid #000; font-size: 11pt; line-height: 7.5mm; text-align: center; margin-bottom: .8mm; }
    .t-k { text-decoration: underline; text-underline-offset: 2px; }
    .t-r.rd { display: inline-block; position: relative; }
    .t-r.rd .t-blank { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); white-space: nowrap; }
    .t-item:has(.rd) { padding-top: 10mm; }
    .t-y { font-size: 10pt; line-height: 1.2; text-decoration: underline; }
    .t-boxes { display: flex; }
    .t-box { width: 14mm; height: 14mm; border: 1.2px solid #000; position: relative; display: block; }
    .t-box + .t-box { border-left: none; }
    .t-box svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .t-box .guide { stroke: #aaa; stroke-width: .6; stroke-dasharray: 2 2; }
    .t-box b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: normal; font-size: 30pt; }
    .t-ans .t-blank, .t-ans .t-box b { color: #d00; }
  }

  .credit { font-size: .75rem; color: #e9f4fd; text-align: center; padding: 0 16px 10px; }
  .credit a { color: #e9f4fd; }

let jaVoice = null;

  try { jaVoice = speechSynthesis.getVoices().find(v => /^ja/i.test(v.lang)) || null; } catch (e) {}
}

// 読み上げ：VOICEVOX（四国めたん）の音声があれば それを、なければ ブラウザの声で よむ
let voiceAudio = null;
function speak(text) {
  const id = typeof VOICE !== 'undefined' && VOICE[String(text).replace(/\s+/g, '')];
  if (voiceAudio) { voiceAudio.pause(); voiceAudio = null; }
  if (id) {
    try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {}
    const a = new Audio('kanji-ganba/voice/' + id + '.m4a');
    voiceAudio = a;
    a.play().catch(() => { if (voiceAudio === a) { voiceAudio = null; ttsSpeak(text); } });
    return;
  }
  ttsSpeak(text);
}
function ttsSpeak(text) {
  if (!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\s+/g, ''));
    u.lang = 'ja-JP'; u.rate = 0.85; if (jaVoice) u.voice = jaVoice;
    speechSynthesis.speak(u);
  } catch (e) {}
}

const lookalike = (a, b) => LOOKALIKE.some(g => g.includes(a) && g.includes(b));
function distractors(k, n, opt = {}) {
  const res = [];
  const ok = c => c !== k && !res.includes(c) && K[c].yomi !== K[k].yomi && K[c].emo !== K[k].emo
    && !(opt.pic && ((PEOPLE.includes(k) && PEOPLE.includes(c)) || lookalike(k, c)));
  if (opt.similar) similarOf(k).forEach(c => { if (res.length < n && ok(c)) res.push(c); });
  shuffle(S.set).forEach(c => { if (res.length < n && ok(c)) res.push(c); });
  shuffle(ORDER).forEach(c => { if (res.length < n && ok(c)) res.push(c); });
  return res;
}

// ───────── もんだいの進め方 ─────────
function startCourse(steps) { S.course = steps; S.ci = 0; startStep(); }
function startStep(only) {
  S.list = shuffle(only || S.set); S.qi = 0; S.done = S.list.map(() => false); S.missed = new Set();
  question();
}
function noteMiss(k) { S.missed.add(k); markMiss(k); }
function stepInfo() { return STEPS[S.course[S.ci] - 1]; }

function navi(i, n) {
  return `<div class="navi">
    <button class="arrow" id="prev" ${i === 0 ? 'disabled' : ''} aria-label="まえへ">◀</button>
    <div class="dots">${Array.from({ length: n }, (_, j) => `<span class="dot ${j === i ? 'on' : (S.done[j] ? 'done' : '')}"></span>`).join('')}</div>
    <button class="arrow" id="next" aria-label="つぎへ">▶</button>
  </div>`;
}
function bindNavi(i, n, go, last) {
  view.querySelector('#prev').onclick = () => { if (i > 0) go(i - 1); };
  view.querySelector('#next').onclick = () => { if (i < n - 1) go(i + 1); else if (last) last(); else menu(); };
}
function nextQ() {
  if (S.qi < S.list.length - 1) { S.qi++; question(); } else stepDone();
}

function question() {
  setBack(menu);
  const st = stepInfo(), k = S.list[S.qi], d = K[k];
  const courseLabel = S.course.length > 1 ? `🚀 ${S.ci + 1}/${S.course.length}  ` : '';
  $pos.textContent = `${courseLabel}${st.n} ${st.t}  ${S.qi + 1} / ${S.list.length}`;
  let html = '', say = null;
  const ansBtn = teacher() && st.n !== 7 ? '<button class="btn ans" id="ans">こたえを 見る</button>' : '';
  const actRow = `<div class="msg" id="msg"></div><div class="acts">${ansBtn}<button class="btn main hidden" id="go">つぎへ ▶</button></div>`;

  if (st.n === 1) {
    const ch = shuffle([k, ...distractors(k, 2, { similar: true })]);
    html = `<p class="q-title">同じ かたちの 漢字を さがそう！</p>
      <div class="stage"><div class="big">${k}</div></div>
      <div class="choices">${ch.map(c => `<button class="ch" data-c="${c}">${c}</button>`).join('')}</div>`;
  } else if (st.n === 2) {
    const ch = shuffle([k, ...distractors(k, 1, { pic: true })]);
    say = d.yomi;
    html = `<p class="q-title">よみに あう 絵を さがそう！</p>
      <div class="stage"><div class="yomi">${esc(d.yomi)}</div><button class="say" data-say="${esc(d.yomi)}">🔊 おとを きく</button></div>
      <div class="choices">${ch.map(c => `<button class="ch picch" data-c="${c}" aria-label="${esc(K[c].yomi)}">${pic(c)}</button>`).join('')}</div>`;
  } else if (st.n === 3) {
    const ch = shuffle([k, ...distractors(k, 1, { pic: true })]);
    html = `<p class="q-title">漢字に あう 絵を さがそう！</p>
      <div class="stage"><div class="word">${esc(d.word)}</div><button class="say" data-say="${esc(d.yomi)}">🔊 おとを きく</button></div>
      <div class="choices">${ch.map(c => `<button class="ch picch" data-c="${c}" aria-label="${esc(K[c].yomi)}">${pic(c)}</button>`).join('')}</div>`;
  } else if (st.n === 4) {
    const chars = [...d.yomi];
    const extra = shuffle([...KANA].filter(c => !chars.includes(c))).slice(0, 2);
    const tiles = shuffle([...chars, ...extra]);
    html = `<p class="q-title">よみを 一文字ずつ えらんで ならべよう！</p>
      <div class="stage"><div class="word">${esc(d.word)}</div></div>
      <div class="slots">${chars.map((_, i) => `<div class="slot${i === 0 ? ' cur' : ''}"></div>`).join('')}</div>
      <div class="tiles">${tiles.map((c, i) => `<button class="tile" data-t="${i}">${c}</button>`).join('')}</div>
      ${teacher() ? '<div class="acts"><button class="btn" id="undo">↩ 1つ けす</button></div>' : ''}`;
  } else if (st.n === 5) {
    html = `<p class="q-title">こえに 出して よもう！</p>
      <div class="stage">${pic(k, 'lg')}<div class="word">${esc(d.word)}</div></div>
      <div class="yomi hidden" id="ry">${esc(d.yomi)}</div>
      <div class="acts"><button class="btn ans" id="reveal">🔊 こたえを きく</button></div>`;
  } else if (st.n === 6) {
    const ch = shuffle([k, ...distractors(k, 2, { similar: true })]);
    say = d.yomi;
    html = `<p class="q-title">よみに あう 漢字を さがそう！</p>
      <div class="stage">${pic(k)}<div class="yomi">${esc(d.yomi)}</div><button class="say" data-say="${esc(d.yomi)}">🔊 おとを きく</button></div>
      <div class="choices">${ch.map(c => `<button class="ch wordch" data-c="${c}">${esc(K[c].word)}</button>`).join('')}</div>`;
  } else if (st.n === 7) {
    html = `<p class="q-title" id="wtitle">書きじゅんを 見よう！</p>
      <div class="tabs">
        <button class="tab" data-w="see">👀 見る</button>
        <button class="tab" data-w="trace">☝️ なぞる</button>
        <button class="tab" data-w="free">✍️ 書く</button>
      </div>
      <div class="stage" style="gap:18px">
        <div style="text-align:center"><div class="word" style="font-size:2.6rem;padding:2px 18px">${esc(d.word)}</div>
          <div style="font-size:1.2rem;margin-top:6px">${esc(d.yomi)}</div>
          <div style="font-size:1rem;margin-top:4px;color:#4d6488">${(STROKES[k] || { s: [] }).s.length}かく</div></div>
        <div class="wbox" id="wbox"></div>
      </div>
      <div class="acts" id="wacts"></div>`;
  }
  view.innerHTML = html + actRow + navi(S.qi, S.list.length);
  bindNavi(S.qi, S.list.length, i => { S.qi = i; question(); }, stepDone);
  view.querySelectorAll('[data-say]').forEach(b => b.onclick = () => speak(b.dataset.say));
  const go = view.querySelector('#go');
  go.onclick = nextQ;
  if (say && !teacher()) setTimeout(() => speak(say), 300);

  if (st.n === 4) return bindBuild(d);
  if (st.n === 5) return bindRead(d);
  if (st.n === 7) return bindWrite(k, d);
  bindChoice(k, d);
}

function success(d) {
  S.done[S.qi] = true;
  const msg = view.querySelector('#msg');
  msg.className = 'msg'; msg.textContent = '⭕ ' + PRAISE[Math.floor(Math.random() * PRAISE.length)];
  view.querySelector('#go').classList.remove('hidden');
  const dot = view.querySelectorAll('.dot')[S.qi]; if (dot) dot.classList.add('done');
  if (!teacher()) speak(d.yomi);
}

// えらぶもんだい（1・2・3・6）
function bindChoice(k, d) {
  const btns = [...view.querySelectorAll('.ch')];
  const right = btns.find(b => b.dataset.c === k);
  let miss = 0, finished = false;
  const msg = view.querySelector('#msg');
  btns.forEach(b => b.onclick = () => {
    if (finished) return;
    if (teacher()) { btns.forEach(x => x.classList.toggle('sel', x === b)); return; }
    if (b === right) {
      finished = true; b.classList.add('ok'); btns.forEach(x => { if (x !== b) x.classList.add('dim'); });
      if (!miss) markGood(k);
      success(d);
    } else {
      if (!miss) noteMiss(k);
      miss++; b.classList.add('shake'); setTimeout(() => b.classList.add('dim'), 350);
      msg.className = 'msg try'; msg.textContent = 'おしい！ もう いちど';
      if (miss >= 1 && btns.filter(x => x !== right && !x.classList.contains('dim')).length <= 1) {
        setTimeout(() => right.classList.add('hint'), 400);
        msg.textContent = 'ひかって いるのを よく 見てね';
      }
    }
  });
  const ans = view.querySelector('#ans');
  if (ans) ans.onclick = () => {
    finished = true; right.classList.add('ok'); right.classList.remove('sel');
    btns.forEach(x => { if (x !== right) x.classList.add('dim'); });

// よみを ならべる（4）
function bindBuild(d) {
  const chars = [...d.yomi];
  const slots = [...view.querySelectorAll('.slot')];
  const tiles = [...view.querySelectorAll('.tile')];
  const msg = view.querySelector('#msg');
  let pos = 0, finished = false, miss = 0;
  const stack = [];
  const paintCur = () => slots.forEach((s, i) => s.classList.toggle('cur', i === pos && !finished));
  const finish = () => {
    finished = true; paintCur();
    slots.forEach((s, i) => { s.textContent = chars[i]; s.classList.add('ok'); });
    tiles.forEach(t => t.classList.add('used'));
    const u = view.querySelector('#undo'); if (u) u.classList.add('hidden');
    const a = view.querySelector('#ans'); if (a) a.classList.add('hidden');
    success(d);
  };
  tiles.forEach(t => t.onclick = () => {
    if (finished || t.classList.contains('used')) return;
    if (teacher()) {
      if (pos >= chars.length) return;
      slots[pos].textContent = t.textContent; t.classList.add('used'); stack.push(t); pos++;
      if (pos >= chars.length) {
        const ok = slots.every((s, i) => s.textContent === chars[i]);
        if (ok) finish(); else { msg.className = 'msg try'; msg.textContent = 'みんなで たしかめよう'; finished = false; }
      }
      paintCur(); return;
    }
    if (t.textContent === chars[pos]) {
      slots[pos].textContent = t.textContent; t.classList.add('used'); pos++;
      msg.textContent = '';
      if (pos >= chars.length) { if (!miss) markGood(d.k); finish(); } else paintCur();
    } else {
      if (!miss) noteMiss(d.k);
      miss++;
      t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake');
      msg.className = 'msg try'; msg.textContent = 'おしい！ もう いちど';
      const right = tiles.find(x => !x.classList.contains('used') && x.textContent === chars[pos]);
      if (right) { right.classList.remove('hint'); void right.offsetWidth; right.classList.add('hint'); }
    }
  });
  const undo = view.querySelector('#undo');
  if (undo) undo.onclick = () => {
    const t = stack.pop(); if (!t) return;
    pos--; slots[pos].textContent = ''; t.classList.remove('used'); msg.textContent = ''; paintCur();
  };
  const ans = view.querySelector('#ans');
  if (ans) ans.onclick = () => { finish(); speak(d.yomi); };
  paintCur();
}

const SVGNS = 'http://www.w3.org/2000/svg';
const GUIDE = '<line class="guide" x1="54.5" y1="0" x2="54.5" y2="109"/><line class="guide" x1="0" y1="54.5" x2="109" y2="54.5"/>';
function strokeSvg(k, cls, opt = {}) {
  const st = STROKES[k]; if (!st) return '';
  const paths = st.s.map((d, i) => `<path class="stk ${typeof cls === 'function' ? cls(i) : cls}" data-i="${i}" d="${d}"/>`).join('');
  const nums = opt.nums ? st.n.map((p, i) => `<text class="snum" x="${p[0]}" y="${p[1]}">${i + 1}</text>`).join('') : '';
  return `<svg viewBox="0 0 109 109" xmlns="${SVGNS}">${opt.guide === false ? '' : GUIDE}${paths}${nums}</svg>`;
}

// 書いた線を うけとる キャンバス
function makeCanvas(box, onStroke) {
  const cv = document.createElement('canvas'); box.appendChild(cv);
  cv.style.touchAction = 'none';
  const ctx = cv.getContext('2d');
  let pts = null, pid = null, fadeT = 0, dpr = 1;
  // 線は 1本の パスに ためずに、点と点の あいだを その場で かく
  // （ためていると、けしたあとに 前の線が また 出てくることが あった）
  const seg = (a, b) => { ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); };
  // キャンバスの 大きさを 見えている 大きさに あわせる。画面の 大きさや ズームが かわったら つくりなおす
  const fit = () => {
    const w = cv.clientWidth, h = cv.clientHeight, d = window.devicePixelRatio || 1;
    if (!w || !h) return;
    if (cv.width === Math.round(w * d) && cv.height === Math.round(h * d)) return;
    dpr = d; cv.width = Math.round(w * d); cv.height = Math.round(h * d);
    ctx.setTransform(d, 0, 0, d, 0, 0);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1f3a6b'; ctx.lineWidth = Math.max(8, w / 30);
    if (pts) for (let i = 0; i < pts.length; i++) seg(pts[Math.max(0, i - 1)], pts[i]);   // かいている とちゅうなら かきなおす
  };
  const at = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  const wipe = () => { clearTimeout(fadeT); cv.style.transition = ''; cv.style.opacity = ''; ctx.clearRect(0, 0, cv.width / dpr, cv.height / dpr); ctx.beginPath(); };
  fit();
  if (window.ResizeObserver) new ResizeObserver(fit).observe(cv); else window.addEventListener('resize', fit);
  cv.onpointerdown = e => {
    e.preventDefault();
    if (pid !== null) return;                       // 2本めの ゆび・てのひらは むし
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    fit();
    if (fadeT) wipe();                              // まちがいの 線が のこっていたら けす
    pid = e.pointerId; try { cv.setPointerCapture(pid); } catch (x) {}
    pts = [at(e)]; seg(pts[0], pts[0]);
  };
  cv.onpointermove = e => {
    if (!pts || e.pointerId !== pid) return;
    e.preventDefault();
    const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    for (const ev of (list.length ? list : [e])) { const p = at(ev), q = pts[pts.length - 1]; if (Math.hypot(p[0] - q[0], p[1] - q[1]) < 0.5) continue; seg(q, p); pts.push(p); }
  };
  const end = e => {
    if (!pts || (e && e.pointerId !== pid)) return;
    const p = pts; pts = null; pid = null;
    const b = cv.getBoundingClientRect(); onStroke(p.map(q => [q[0] / b.width * 109, q[1] / b.height * 109]));
  };
  cv.onpointerup = end; cv.onpointercancel = end; cv.onlostpointercapture = end;
  return {
    clear: () => { pts = null; pid = null; wipe(); fadeT = 0; },
    // まちがえた 線は すぐに けさず、すこし みせてから うすく きえる
    fade: () => { clearTimeout(fadeT); cv.style.transition = 'opacity .5s'; fadeT = setTimeout(() => { cv.style.opacity = '0'; fadeT = setTimeout(() => { wipe(); fadeT = 0; }, 500); }, 600); }
  };
}

function bindWrite(k, d) {
  const st = STROKES[k];
  const box = view.querySelector('#wbox'), acts = view.querySelector('#wacts'), msg = view.querySelector('#msg');
  const title = view.querySelector('#wtitle');
  const tabs = [...view.querySelectorAll('.tab')];
  if (!st) { box.innerHTML = ''; msg.className = 'msg try'; msg.textContent = '書きじゅんの データが よみこめませんでした'; return; }
  let timer = null, tab = '';
  const stop = () => { if (timer) { clearTimeout(timer); timer = null; } };

  // 👀 見る：1画ずつ アニメーション
  function see() {
    title.textContent = '書きじゅんを 見よう！';
    box.innerHTML = strokeSvg(k, 'base') ;
    const svg = box.querySelector('svg');
    let shown = 0;
    const inkPaths = st.s.map((dd, i) => {
      const p = document.createElementNS(SVGNS, 'path'); p.setAttribute('d', dd); p.setAttribute('class', 'stk ink');
      svg.appendChild(p); const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; p._L = L; return p;
    });
    const nums = st.n.map((pt, i) => { const t = document.createElementNS(SVGNS, 'text'); t.setAttribute('class', 'snum'); t.setAttribute('x', pt[0]); t.setAttribute('y', pt[1]); t.textContent = i + 1; t.style.display = 'none'; svg.appendChild(t); return t; });
    const draw = i => {
      const p = inkPaths[i]; nums[i].style.display = '';
      p.style.transition = 'none'; p.style.strokeDashoffset = p._L; void p.getBoundingClientRect();
      p.style.transition = `stroke-dashoffset ${Math.max(0.45, p._L / 90)}s linear`; p.style.strokeDashoffset = 0;
      return Math.max(450, p._L / 90 * 1000) + 250;
    };
    const reset = () => { stop(); shown = 0; inkPaths.forEach(p => { p.style.transition = 'none'; p.style.strokeDashoffset = p._L; }); nums.forEach(t => t.style.display = 'none'); };
    const playAll = () => {
      reset();
      const loop = () => { if (shown >= inkPaths.length) { timer = null; if (!teacher()) tabs[1].classList.add('glow'); return; } timer = setTimeout(loop, draw(shown++)); };
      loop();
    };
    const one = () => { stop(); if (shown >= inkPaths.length) reset(); draw(shown++); };
    acts.innerHTML = `<button class="btn" id="wPlay">▶ さいしょから</button><button class="btn" id="wOne">1かくずつ ▶</button>
      <button class="btn main" id="wToTrace">☝️ なぞって みよう</button>`;
    acts.querySelector('#wPlay').onclick = playAll;
    acts.querySelector('#wOne').onclick = one;
    acts.querySelector('#wToTrace').onclick = () => setTab('trace');
    if (teacher()) reset(); else playAll();
  }

  // ☝️ なぞる：1画ずつ、だいたい あっていれば つぎの画へ
  function trace() {
    title.textContent = '● から なぞろう！';
    tabs[1].classList.remove('glow');
    box.innerHTML = strokeSvg(k, i => i === 0 ? 'next' : 'base');
    const svg = box.querySelector('svg');
    const paths = [...svg.querySelectorAll('path.stk')];
    const dot = document.createElementNS(SVGNS, 'circle'); dot.setAttribute('r', '4'); dot.setAttribute('class', 'startdot'); svg.appendChild(dot);
    let cur = 0, missHere = 0;
    const sample = p => { const L = p.getTotalLength(), n = Math.max(6, Math.round(L / 4)); return Array.from({ length: n + 1 }, (_, i) => { const q = p.getPointAtLength(L * i / n); return [q.x, q.y]; }); };
    const placeDot = () => { if (cur < paths.length) { const q = paths[cur].getPointAtLength(0); dot.setAttribute('cx', q.x); dot.setAttribute('cy', q.y); } else dot.remove(); };
    const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
    const near = (pt, line) => line.reduce((m, q) => Math.min(m, dist(pt, q)), 1e9);
    function judge(drawn) {
      const ref = sample(paths[cur]); const L = paths[cur].getTotalLength();
      if (drawn.length < 2) drawn = [drawn[0], drawn[0]];
      let len = 0; for (let i = 1; i < drawn.length; i++) len += dist(drawn[i - 1], drawn[i]);
      const tol = 15;
      const startOk = dist(drawn[0], ref[0]) < tol + 4;
      const endOk = dist(drawn[drawn.length - 1], ref[ref.length - 1]) < tol + 6;
      const cover = ref.filter(q => near(q, drawn) < tol).length / ref.length;
      const stray = drawn.filter(q => near(q, ref) > tol + 8).length / drawn.length;
      return startOk && endOk && cover > 0.7 && stray < 0.25 && len > L * 0.5;
    }
    const pad = makeCanvas(box, drawn => {
      if (cur >= paths.length) return;
      if (judge(drawn)) {
        paths[cur].setAttribute('class', 'stk ink'); cur++; missHere = 0;
        if (cur < paths.length) paths[cur].setAttribute('class', 'stk next');
        placeDot(); msg.textContent = ''; pad.clear();
        if (cur >= paths.length) { title.textContent = 'なぞれたね！'; success(d); acts.querySelector('#wToFree').classList.add('main'); }
      } else {
        missHere++; pad.fade();
        msg.className = 'msg try'; msg.textContent = missHere >= 2 ? '● から、オレンジの 線の 上を ゆっくり なぞってね' : 'おしい！ ● から もう いちど';
      }
    });
    placeDot();
    acts.innerHTML = `<button class="btn" id="wRe">🔄 さいしょから</button><button class="btn" id="wToFree">✍️ 自分で 書いて みよう</button>`;
    acts.querySelector('#wRe').onclick = trace;
    acts.querySelector('#wToFree').onclick = () => setTab('free');
  }

  // ✍️ 書く：じゆうに 書いて、自分で たしかめる
  function free() {
    title.textContent = '見ないで 書いて みよう！';
    box.innerHTML = `<svg viewBox="0 0 109 109" xmlns="${SVGNS}">${GUIDE}</svg>`;
    const model = document.createElement('div'); model.style.cssText = 'position:absolute;inset:0;display:none'; model.innerHTML = strokeSvg(k, 'faint', { guide: false });
    box.appendChild(model);
    const pad = makeCanvas(box, () => {});
    acts.innerHTML = `<button class="btn" id="wClr">🧽 けす</button><button class="btn" id="wModel">👀 お手本を 出す</button>
      <button class="btn main" id="wOk">⭕ できた！</button>`;
    acts.querySelector('#wClr').onclick = () => { pad.clear(); };
    acts.querySelector('#wModel').onclick = e => { const on = model.style.display === 'none'; model.style.display = on ? 'block' : 'none'; e.target.textContent = on ? '🙈 お手本を けす' : '👀 お手本を 出す'; };
    acts.querySelector('#wOk').onclick = () => { model.style.display = 'block'; title.textContent = 'お手本と くらべて みよう'; success(d); };
  }

  function setTab(t) {
    stop(); tab = t; msg.textContent = '';
    tabs.forEach(b => b.classList.toggle('on', b.dataset.w === t));
    ({ see, trace, free })[t]();
  }
  tabs.forEach(b => b.onclick = () => setTab(b.dataset.w));
  setTab('see');
}

// 問題の文は kanji-ganba/test.js（字｜よみの文｜かきの文）。[漢字]{よみ} が 問題にする ところ
const TEST = {};
function parseTest(s) {
  const m = (s || '').match(/^(.*)\[(.+?)\]\{(.+?)\}(.*)$/);
  return m ? { pre: m[1], kj: m[2], yomi: m[3], post: m[4] } : null;
}
Object.values(window.KANJI_TEST || {}).forEach(raw => raw.trim().split('\n').forEach(line => {
  const [k, r, w] = line.split('|');
  const q = { r: parseTest(r), w: parseTest(w) };
  if (K[k] && q.r && q.w) TEST[k] = q;
}));
const hasTest = ks => ks.length > 0 && ks.every(k => TEST[k]);
const testTitle = () => S.unitName || S.set.join('');

// 画面のテスト：よみ（ひらがなを ならべる・じどうで ○×）→ かき（書いて、お手本と くらべて 自分で ○×）
function startTest(qs) {
  S.test = {
    qs: qs || [...shuffle(S.set).map(k => ({ k, t: 'r' })), ...shuffle(S.set).map(k => ({ k, t: 'w' }))],
    i: 0, res: [], retry: !!qs,
  };
  testQ();
}
function testQ() {
  const T = S.test, { k, t } = T.qs[T.i], q = TEST[k][t];
  const nR = T.qs.filter(x => x.t === 'r').length;
  const no = t === 'r' ? T.i + 1 : T.i - nR + 1, of = t === 'r' ? nR : T.qs.length - nR;
  setBack(() => { if (confirm('テストを やめて もどりますか？')) menu(); });
  document.getElementById('topRight').textContent = '';
  $pos.textContent = `📝 テスト ${t === 'r' ? 'よみ' : 'かき'}  ${no} / ${of}`;
  const sent = t === 'r'
    ? `${esc(q.pre)}<span class="tk">${esc(q.kj)}</span>${esc(q.post)}`
    : `${esc(q.pre)}<span class="ty">${esc(q.yomi)}</span>${esc(q.post)}`;
  const progress = `<div class="tprog">${T.qs.map((x, j) => `<span class="${j === T.i ? 'on' : (T.res[j] === true ? 'ok' : (T.res[j] === false ? 'ng' : ''))}${x.t === 'w' && (j === 0 || T.qs[j - 1].t === 'r') ? ' gap' : ''}"></span>`).join('')}</div>`;
  if (t === 'r') {
    const chars = [...q.yomi];
    const extra = shuffle([...KANA].filter(c => !chars.includes(c))).slice(0, chars.length > 2 ? 3 : 2);
    view.innerHTML = `
      <p class="q-title">線の 漢字の よみを えらんで ならべよう</p>
      <div class="tsent">${sent}</div>
      <div class="slots">${chars.map((_, i) => `<div class="slot${i === 0 ? ' cur' : ''}"></div>`).join('')}</div>
      <div class="tiles">${shuffle([...chars, ...extra]).map((c, i) => `<button class="tile" data-t="${i}">${c}</button>`).join('')}</div>
      <div class="msg" id="msg"></div>
      <div class="acts" id="tacts"><button class="btn" id="undo">↩ 1つ けす</button><button class="btn main" id="chk" disabled>こたえあわせ</button></div>
      ${progress}`;
    bindTestRead(k, q, chars);
  } else {
    view.innerHTML = `
      <p class="q-title">線の ひらがなを 漢字で 書こう</p>
      <div class="tsent">${sent}</div>
      <div class="tboxes">${[...q.kj].map(c => `<div class="wbox tbox" data-c="${c}"><svg viewBox="0 0 109 109" xmlns="${SVGNS}">${GUIDE}</svg></div>`).join('')}</div>
      <div class="msg" id="msg"></div>
      <div class="acts" id="tacts"><button class="btn" id="clr">🧽 けす</button><button class="btn main" id="see">こたえを 見る</button></div>
      ${progress}`;

  }
}
function testAnswer(k, ok) {
  const T = S.test; T.res[T.i] = ok;
  if (ok) markGood(k); else markMiss(k);
  const acts = view.querySelector('#tacts');
  acts.innerHTML = `<button class="btn main" id="tnext">${T.i < T.qs.length - 1 ? 'つぎへ ▶' : 'けっかを 見る ▶'}</button>`;

function bindTestRead(k, q, chars) {

function testResult() {
  const T = S.test;
  const cnt = t => T.qs.filter(x => x.t === t).length, okN = t => T.qs.filter((x, j) => x.t === t && T.res[j]).length;
  const all = T.qs.length, ok = okN('r') + okN('w'), score = Math.round(ok / all * 100);
  const miss = T.qs.filter((_, j) => !T.res[j]);
  const missOf = t => miss.filter(x => x.t === t).map(x => x.k).join('');
  setBack(menu); $pos.textContent = '';
  view.innerHTML = `
    <div class="done-big">${score === 100 ? '💯' : (score >= 80 ? '🌟' : '💪')}</div>
    <p class="lead" style="font-size:1.6rem">${T.retry ? 'やりなおし' : 'テスト'} おわり！${T.retry ? '' : `　${esc(testTitle())}`}</p>
    ${T.retry ? '' : `<div class="tscore"><b>${score}</b> てん</div>`}
    <p class="sub" style="font-size:1.3rem">${cnt('r') ? `よみ ${okN('r')} / ${cnt('r')}　` : ''}${cnt('w') ? `かき ${okN('w')} / ${cnt('w')}` : ''}</p>
    ${miss.length ? `<div class="nigate"><b>🔁 まちがえた もんだい</b>
      ${missOf('r') ? `<span>よみ <span class="ks">${missOf('r')}</span></span>` : ''}${missOf('w') ? `<span>かき <span class="ks">${missOf('w')}</span></span>` : ''}
      <button class="btn" id="tretry">まちがえた もんだいだけ もう いちど</button></div>` : `<p class="lead">ぜんぶ せいかい！ よく ガンバったね。</p>`}
    <div class="acts">
      <button class="btn" id="tagain">さいしょから もう いちど</button>
      <button class="btn" id="tmenu">どうやる？に もどる</button>
    </div>`;
  if (!teacher()) speak(miss.length ? 'テスト おわり。まちがえた もんだいを もう いちど やって みよう' : 'ぜんぶ せいかい。よく ガンバったね');
  const rt = view.querySelector('#tretry'); if (rt) rt.onclick = () => startTest(miss);
  view.querySelector('#tagain').onclick = () => startTest();
  view.querySelector('#tmenu').onclick = menu;
}

// 紙のテスト：1まいめ＝もんだい、2まいめ＝こたえ（赤）
function printTest() {
  const rd = shuffle(S.set), wr = shuffle(S.set), n = S.set.length;
  const grid = items => `<div class="t-grid" style="grid-template-rows:repeat(${Math.ceil(items.length / 2)},auto)">${items.join('')}</div>`;
  const rItem = (k, i, ans) => { const q = TEST[k].r; return `<div class="t-item"><span class="t-no">(${i + 1})</span><span class="t-s">${esc(q.pre)}<span class="t-r rd"><span class="t-blank" style="min-width:${[...q.yomi].length * 1.05 + .6}em">${ans ? esc(q.yomi) : ''}</span><span class="t-k">${esc(q.kj)}</span></span>${esc(q.post)}</span></div>`; };
  const wItem = (k, i, ans) => { const q = TEST[k].w; return `<div class="t-item"><span class="t-no">(${i + 1})</span><span class="t-s">${esc(q.pre)}<span class="t-r"><span class="t-y">${esc(q.yomi)}</span><span class="t-boxes">${[...q.kj].map(c => `<span class="t-box"><svg viewBox="0 0 109 109" xmlns="${SVGNS}">${GUIDE}</svg>${ans ? `<b>${c}</b>` : ''}</span>`).join('')}</span></span>${esc(q.post)}</span></div>`; };
  const page = ans => `<div class="t-page${ans ? ' t-ans' : ''}">
    <div class="p-head"><b>漢字テスト${ans ? '（こたえ）' : ''}　${esc(testTitle())}</b><span>${ans ? '' : '　月　　日　なまえ（　　　　　　　　）'}</span></div>
    <div class="t-score">${ans ? '' : `<span>　　　</span>/ ${n * 2}もん`}</div>
    <h4>一　――の 漢字の よみを □に ひらがなで 書きましょう。</h4>
    ${grid(rd.map((k, i) => rItem(k, i, ans)))}
    <h4>二　――の ひらがなを □に 漢字で 書きましょう。</h4>
    ${grid(wr.map((k, i) => wItem(k, i, ans)))}
  </div>`;
  document.getElementById('print').innerHTML = page(false) + page(true);
  window.print();
}

// ───────── ステップのおわり ─────────
function stepDone() {
  const st = stepInfo(), more = S.ci < S.course.length - 1;
  const allDone = !more && S.course.length > 1;
  const missed = ALL_ORDER.filter(k => S.missed && S.missed.has(k));
  $pos.textContent = '';
  view.innerHTML = `
    <div class="done-big">${allDone ? '🏆' : '🌟'}</div>
    <p class="lead" style="font-size:1.6rem">${allDone ? 'ぜんぶの ステップが おわったよ！' : `ステップ${st.n}「${st.t}」 できたね！`}</p>
    <div class="chosen">${S.set.join('')}</div>
    <p class="sub">${allDone ? 'さいごまで ガンバったね。' : 'よく ガンバりました。'}</p>
    ${missed.length ? `<div class="nigate"><b>🔁 まちがえた字</b><span class="ks">${missed.join('')}</span>
      <button class="btn" id="retry">この字だけ もう いちど</button></div>` : ''}
    <div class="acts">
      ${more ? `<button class="btn main" id="nx">つぎの ステップへ ▶</button>` : ''}
      <button class="btn" id="again">もう いちど</button>
      <button class="btn" id="mn">どうやる？に もどる</button>
    </div>`;
  if (!teacher()) speak(allDone ? 'ぜんぶ おわったよ。よく ガンバったね' : 'できたね');
  const nx = view.querySelector('#nx'); if (nx) nx.onclick = () => { S.ci++; startStep(); };
  const rt = view.querySelector('#retry'); if (rt) rt.onclick = () => startStep(missed);
  view.querySelector('#again').onclick = () => startStep();
  view.querySelector('#mn').onclick = menu;
}

// ───────── URLで直接ひらく ─────────
// ?mode=teacher|student  ?grade=1|2|3|4|5|6  ?g=1〜16（1年）・1〜32（2年）・1〜40（3年・4年）・1〜38（5年・6年）（まとまり）  ?kanji=山川木  ?step=1〜7|all|card
// ?by=mitsu&u=1〜（光村の単元。①②に分けたあとの番号。いまは1年と3・4年下だけ）  ?step=test（単元テスト。テストの文がある字だけ）
(function init() {
  const p = new URLSearchParams(location.search);
  setMode(p.get('mode') || load('mode') || 'student');
  const kj = [...(p.get('kanji') || '')].filter(c => K[c]);
  // 学年：?kanji があれば その字の いちばん上の学年、つぎに ?grade、なければ まえに えらんだ学年
  setGrade(kj.length ? Math.max(...kj.map(c => K[c].g)) : parseInt(p.get('grade') || load('grade') || '1', 10));
  setBy(p.get('by') || load('by') || 'naka');
  const g = parseInt(p.get('g'), 10), u = parseInt(p.get('u'), 10), us = unitList();
  if (kj.length) S.set = [...new Set(kj)];
  else if (us && u >= 1 && u <= us.length) { S.set = [...us[u - 1].ks]; S.unitName = us[u - 1].name; }
  else if (g >= 1 && g <= GROUPS.length) S.set = [...GROUPS[g - 1]];
  if (!S.set.length) return home();
  const step = p.get('step');
  if (step === 'all') startCourse(ALL_STEPS);
  else if (step === 'card') cards(0);
  else if (step === 'test' && hasTest(S.set)) startTest();
  else if (/^[1-7]$/.test(step || '')) startCourse([+step]);
  else menu();
})();
</script>
