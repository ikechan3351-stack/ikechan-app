<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>授業すすめボード</title>
<style>
/* Layout: 授業の一覧（棚）→ 1つの授業を開くと、上に流れの帯、中央に大きな活動カード、下に前へ/次へ。編集は同じ帯の下にフォーム */
:root{
  --bg:#e8f1f8; --surface:#FFFFFF; --ink:#23303c; --muted:#4a6a88; --line:#c9d7e3;
  --board:#23527d; --on-board:#FFFFFF; --on-c:#FFFFFF; --warn:#B3261E;
  --c-i1:#2D5CA6; --c-i2:#1F6C99; --c-i3:#2F6288;
  --c-d1:#A65F08; --c-d2:#A8520F; --c-d3:#A34716; --c-d4:#96481F; --c-d5:#8F5310;
  --c-s1:#674BA0; --c-s2:#7A4599; --c-s3:#584FAA; --c-s4:#6B4A8F;
  --t-i:#E5ECF8; --t-d:#FAEEDC; --t-s:#EDE7F7;
  --f-disp:"Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Hiragino Sans","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}

html,body{height:100%}
body{margin:0;background:linear-gradient(160deg,#e8f1f8 0%,#cfe0ee 100%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 110px;max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--board);outline-offset:2px}

[data-c^="i"]{--tc:var(--t-i)}
[data-c^="d"]{--tc:var(--t-d)}
[data-c^="s"]{--tc:var(--t-s)}
[data-c="i1"]{--c:var(--c-i1)}
[data-c="i2"]{--c:var(--c-i2)}
[data-c="i3"]{--c:var(--c-i3)}
[data-c="d1"]{--c:var(--c-d1)}
[data-c="d2"]{--c:var(--c-d2)}
[data-c="d3"]{--c:var(--c-d3)}
[data-c="d4"]{--c:var(--c-d4)}
[data-c="d5"]{--c:var(--c-d5)}
[data-c="s1"]{--c:var(--c-s1)}
[data-c="s2"]{--c:var(--c-s2)}
[data-c="s3"]{--c:var(--c-s3)}
[data-c="s4"]{--c:var(--c-s4)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
.unit{min-width:0;display:flex;align-items:center;gap:12px}
.unit .home{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:700;white-space:nowrap}
.unit .t{min-width:0}
.unit small{display:block;color:var(--muted);font-size:13px;letter-spacing:.04em}
.unit h1{margin:0;font-family:var(--f-disp);font-size:clamp(20px,2.2vw,28px);font-weight:700;text-wrap:balance}
.modes{display:flex;border:1.5px solid var(--board);border-radius:999px;overflow:hidden}
.modes button{border:0;background:transparent;padding:8px 18px;font-weight:700;color:var(--board)}
.modes button[aria-pressed="true"]{background:var(--board);color:var(--on-board)}

/* flow strip */
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.step{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px 6px 6px;max-width:240px;text-align:left}
.step .n{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--tc);color:var(--c);flex:none;font-variant-numeric:tabular-nums}
.step .s{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.step .s b{font-size:11px;color:var(--c);letter-spacing:.06em}
.step .s span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step[aria-current="step"]{border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset}
.step.done{opacity:.6}

/* stage card */
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.band{background:var(--c);color:var(--on-c);display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px clamp(16px,3vw,36px)}
.band .kind{font-family:var(--f-disp);font-weight:700;font-size:clamp(18px,1.8vw,26px);letter-spacing:.08em}
.band .meta{margin-left:auto;font-size:15px;font-variant-numeric:tabular-nums}
.body{padding:clamp(18px,3vw,44px);display:flex;flex-direction:column;gap:clamp(14px,2vw,26px)}
.title{margin:0;font-family:var(--f-disp);font-weight:700;font-size:clamp(30px,4.6vw,68px);line-height:1.25;text-wrap:balance}
.text{margin:0;font-size:clamp(20px,2.6vw,38px);line-height:1.6;white-space:pre-wrap;max-width:32em}
.mats{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.mats b{font-size:14px;color:var(--muted);letter-spacing:.08em;margin-right:4px}
.mats span{background:var(--tc);color:var(--ink);border-radius:999px;padding:4px 14px;font-size:clamp(15px,1.6vw,22px)}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 18px;font-weight:700;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--c,var(--board));border-color:var(--c,var(--board));color:var(--on-c)}
.btn.go{background:var(--board);border-color:var(--board);color:var(--on-board)}
.btn.big{font-size:clamp(18px,2vw,26px);padding:14px 26px;display:inline-block}
.btn.danger{color:var(--warn)}
.timer{font-family:var(--f-disp);font-size:clamp(26px,3vw,44px);font-variant-numeric:tabular-nums;min-width:4.5ch;text-align:center}
.timer.over{color:var(--warn)}
.reveal{border:2px dashed var(--c);border-radius:14px;padding:16px 20px;font-family:var(--f-disp);font-weight:700;font-size:clamp(22px,3vw,42px);background:var(--tc)}
.note{color:var(--muted);font-size:15px;margin:0}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.photos button{border:1.5px solid var(--line);padding:0;border-radius:10px;overflow:hidden;background:var(--bg);aspect-ratio:4/3;max-width:100%}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.upl input{position:absolute;opacity:0;width:1px;height:1px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:50;border:0;width:100%;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lightbox img{max-height:90vh;max-width:100%;border-radius:8px}
textarea.write{width:100%;min-height:3.4em;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding:12px 16px;font-family:var(--f-disp);font-size:clamp(22px,3vw,40px);line-height:1.5;resize:vertical}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1.5px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;justify-content:center;z-index:20}
.nav .btn{font-size:clamp(16px,1.8vw,22px);padding:10px clamp(14px,2.4vw,30px)}
.nav .count{font-variant-numeric:tabular-nums;color:var(--muted);min-width:4em;text-align:center}

/* panels & forms */
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px clamp(14px,2vw,24px);display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-family:var(--f-disp);font-size:20px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 10px;font-size:16px;color:var(--ink);min-width:0}
label.f textarea{min-height:4.5em;resize:vertical}
.ecard{border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.ecard .eh{background:var(--tc);display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px}
.ecard .eh b{color:var(--c);font-family:var(--f-disp);font-size:17px;font-variant-numeric:tabular-nums}
.ecard .eh .sp{flex:1}
.ecard .eh button{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:14px}
.ecard .eh button.danger{color:var(--warn)}
.ecard .eb{padding:12px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--c);color:var(--c);background:var(--tc);border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px}
.total{font-variant-numeric:tabular-nums;font-weight:700}
.total.over{color:var(--warn)}
.msg{font-size:14px;color:var(--muted);min-height:1.4em;margin:0}

/* library */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.lesson{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lesson small{color:var(--muted);font-size:13px}
.lesson h3{margin:0;font-family:var(--f-disp);font-size:20px;line-height:1.35;text-wrap:balance}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:var(--bg)}
.bar span{background:var(--c);min-width:4px}
.lesson .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.lesson .acts .btn{padding:7px 12px;font-size:14px}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tpl{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--bg)}
.tpl:has(input:checked){border-color:var(--board);box-shadow:0 0 0 2px var(--board) inset}
.tpl input{margin-top:5px;accent-color:var(--board)}
.tpl b{display:block;font-size:15px}
.tpl span{font-size:13px;color:var(--muted);line-height:1.45}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:9px;border:2px solid transparent;background:var(--c)}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.trow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.trow .chip{display:inline-flex;gap:8px;align-items:center}
.trow .chip button{border:0;background:transparent;color:var(--warn);padding:0 2px;font-size:13px}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}

/* 教材をカードに入れる */
.back-link{font-size:.85rem;color:#23527d;text-decoration:none;white-space:nowrap}
.card.compact .band{padding:4px clamp(14px,2vw,24px)}
.card.compact .band .kind{font-size:16px}
.card.compact .body{padding:8px clamp(14px,2vw,24px);gap:6px 14px;flex-direction:row;flex-wrap:wrap;align-items:center}
.card.compact .title{font-size:clamp(20px,2.2vw,30px)}
.card.compact .text{font-size:clamp(15px,1.4vw,19px);max-width:none;white-space:normal}
.card.compact .note:empty{display:none}
.card.compact .timer{font-size:clamp(20px,2vw,28px)}
.card.compact .btn{padding:6px 12px}
.picked{font-weight:700;font-size:clamp(15px,1.5vw,20px)}
/* 導入・展開・まとめのまとまり */
.sgrp{flex:0 0 auto;display:flex;flex-direction:column;gap:2px}
.sgl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;padding-left:4px}
.sgi{display:flex;gap:8px}
/* だれと・どんな活動 */
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{background:var(--c);color:var(--on-c);border-radius:999px;padding:4px 20px;font-weight:700;font-size:clamp(18px,2.4vw,32px)}
.card.compact .tag{font-size:15px;padding:2px 12px}
.card.compact .photos{flex:1 1 100%;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 14px;font-weight:700;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--on-c)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:120px;aspect-ratio:4/3;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;border:1.5px solid var(--line);background:var(--surface);color:var(--warn);border-radius:8px;padding:0 8px;font-size:13px;font-weight:700}
.addgrp{display:flex;flex-direction:column;gap:6px}
.addgrp b{font-size:14px;color:var(--muted)}
#stageApp iframe{display:block;width:100%;height:calc(100vh - 90px);min-height:480px;border:1.5px solid var(--line);border-radius:14px;background:#fff}
.appbox{border:1.5px dashed var(--c);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--tc)}
.appbox details{font-size:13px;color:var(--muted)}
.picker{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px))}
.picker .ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.picker .ph h2{margin:0;font-size:20px;flex:1;min-width:12em}
.pfind{display:flex;gap:8px;flex-wrap:wrap}
.pfind input{flex:1;min-width:200px}
.pfind input,.pfind select{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;font-size:17px}
.plist{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;align-content:start}
.pitem{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.pitem .ico{font-size:24px;line-height:1.2}
.pitem b{display:block;font-size:15px}
.pitem span span{display:block;font-size:13px;color:var(--muted);line-height:1.45}
.pwork{flex:1;min-height:0;display:grid;grid-template-columns:minmax(260px,320px) 1fr;gap:12px}
.pside{overflow:auto;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pside h3{margin:0;font-size:15px}
.parts{display:flex;flex-direction:column;gap:6px}
.parts button{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:700}
.parts button[aria-pressed="true"]{border-color:var(--board);box-shadow:0 0 0 2px var(--board) inset}
.pside .btn{padding:8px 12px}
.pside .check{display:flex;gap:8px;align-items:center;font-size:14px}
#pFrame{width:100%;height:100%;min-height:360px;border:1.5px solid var(--line);border-radius:14px;background:#fff}
@media (max-width:760px){.pwork{grid-template-columns:1fr;grid-template-rows:minmax(160px,40%) 1fr}}
@media (prefers-reduced-motion: no-preference){.card{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>

<div class="wrap">
  <header class="top">
    <div class="unit"><a class="back-link" id="bBack" href="../index.html">← もどる</a><button class="home" id="bHome" hidden>← 授業の一覧</button><div class="t"><small id="grade"></small><h1 id="unitTitle">授業すすめボード</h1></div></div>
    <div class="modes" id="modes" role="group" aria-label="画面の切りかえ" hidden>
      <button id="mPresent" aria-pressed="true">授業する</button>
      <button id="mEdit" aria-pressed="false">流れを作る</button>
    </div>
  </header>
  <nav class="strip" id="strip" aria-label="授業の流れ" hidden></nav>
  <main id="vList"></main>
  <main id="vPresent" hidden></main>
  <div id="stageApp" hidden></div>
  <main id="vEdit" hidden></main>
</div>
<script src="app-list.js"></script>
<div class="nav" id="nav" hidden>
  <button class="btn" id="bFirst">最初から</button>
  <button class="btn" id="bPrev">← 前へ</button>
  <span class="count" id="count"></span>
  <button class="btn go" id="bNext">次へ →</button>
</div>
<div class="picker" id="picker" role="dialog" aria-label="教材をえらぶ" hidden>
  <div class="ph"><h2 id="pTitle">教材をえらぶ</h2><button class="btn" id="pBackList" hidden>← 教材をえらびなおす</button><button class="btn" id="pClose">やめる</button></div>
  <div id="pStep1" style="display:flex;flex-direction:column;gap:10px;flex:1;min-height:0">
    <div class="pfind"><input id="pQ" type="search" placeholder="教材の名前や単元でさがす（例：わり算）" aria-label="教材をさがす"><select id="pSubj" aria-label="教科"><option value="">すべての教科</option><option value="m">算数・数学</option><option value="j">国語</option><option value="s">社会</option><option value="c">理科</option><option value="g">ゲーム・パズル</option></select></div>
    <div class="plist" id="pList"></div>
  </div>
  <div class="pwork" id="pStep2" hidden>
    <div class="pside">
      <h3>① 使う部分をえらぶ</h3>
      <div class="parts" id="pParts"></div>
      <p class="note" id="pPartNote"></p>
      <label class="check" id="pTeacherWrap"><input type="checkbox" id="pTeacher">先生モードで開く</label>
      <h3>② これでよければ</h3>
      <p class="note" id="pPressed">右の画面でボタンを押して進めることもできます。押した順に、授業でも自動で押します。</p>
      <button class="btn go" id="pUse">この画面を使う</button>
      <button class="btn" id="pWhole">教材全体を使う</button>
      <button class="btn" id="pRestart">はじめから やりなおす</button>
    </div>
    <iframe id="pFrame" title="教材の画面" allow="autoplay; fullscreen"></iframe>
  </div>
</div>
<button class="lightbox" id="lb" hidden aria-label="閉じる"><img id="lbImg" alt="大きく映した写真"></button>

<script>
/* ---------- カードの種類（授業の段階） ---------- */
const PHASES={intro:{label:'導入',custom:'i3'},dev:{label:'展開',custom:'d5'},sum:{label:'まとめ',custom:'s4'}};
const BUILTIN={
  fukushu:{label:'復習',phase:'intro',c:'i1'},
  meate:{label:'めあての確認',phase:'intro',c:'i2'},
  yosou:{label:'予想する',phase:'dev',c:'d1'},
  shiraberu:{label:'調べる',phase:'dev',c:'d2'},
  kangaeru:{label:'考える',phase:'dev',c:'d3'},
  fukameru:{label:'深める',phase:'dev',c:'d4'},
  tashikameru:{label:'確かめる',phase:'sum',c:'s1'},
  matomeru:{label:'まとめる',phase:'sum',c:'s2',write:true},
  furikaeru:{label:'振り返る',phase:'sum',c:'s3',write:true}
};
const WHO={self:'個人で',all:'全体で',group:'グループで'};
const ACT={talk:'話し合う',hands:'操作活動',drill:'練習ドリル',think:'じっくり考える'};
const USES={app:'アプリ',url:'インターネット',image:'写真・画像',thing:'具体物',note:'ノートへ書く'};

/* ---------- ひな形 ---------- */
const C=(type,title,text,who,act,uses,min,reveal='',thing='')=>({type,title,text,who,act,uses,thing,min,url:'',urlName:'',reveal,images:[]});
const TEMPLATES=[
  {key:'blank',name:'白紙から',desc:'カード1枚から自由に作る',cards:[C('meate','問題をつかもう','','all','',[],5)]},

  talk:{type:'kangaeru',who:'all',act:'talk',uses:[]},
  hands:{type:'shiraberu',who:'group',act:'hands',uses:[]},
  paper:{type:'kangaeru',who:'self',act:'think',uses:['note']},

const APP_FIELDS=['path','steps','pickLabel','appName','icon','teacher','showAll'];
/* 戻り値：形を変えたら true */
function normalizeCard(c,customKeys){
  let changed=false;
  if(!Array.isArray(c.uses)){
    changed=true;
    const m=LEGACY[c.type]||{type:c.type,who:'all',act:'',uses:[]},wasApp=c.type==='app';
    c.type=m.type;c.who=m.who;c.act=m.act;c.uses=[...m.uses];
    if(wasApp&&c.path)c.uses.push('app');
    else if(wasApp&&c.url)c.uses.push('url');
    else if(wasApp)c.uses.push('app');
    if(!wasApp){APP_FIELDS.forEach(k=>delete c[k]);c.url=''}
    c.thing=String(c.mats||'').trim();
    if(c.thing)c.uses.push('thing');
    delete c.mats;
  }
  if(!(c.who in WHO))c.who='all';
  if(!(c.act in ACT))c.act='';
  c.uses=c.uses.filter(u=>u in USES);
  if(!Array.isArray(c.images))c.images=[];
  ['title','text','thing','url','urlName','reveal'].forEach(k=>{c[k]=String(c[k]??'')});
  if(!BUILTIN[c.type]&&!customKeys.has(c.type))c.type='kangaeru';
  return changed;
}

/* ---------- 用意した写真（端末の中の IndexedDB に保存） ---------- */
let imgDb=null;
const imgUrls={};
function openImgDb(){
  return imgDb||(imgDb=new Promise((ok,ng)=>{
    try{const r=indexedDB.open(KEY+'-images',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('images');
      r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)}catch(e){ng(e)}
  }));
}
async function imgTx(mode,fn){
  const d=await openImgDb();
  return new Promise((ok,ng)=>{
    const tx=d.transaction('images',mode),rq=fn(tx.objectStore('images'));
    tx.oncomplete=()=>ok(rq&&rq.result);tx.onerror=()=>ng(tx.error);tx.onabort=()=>ng(tx.error);
  });
}
/* 映すのに十分な大きさ（長い辺 1600px）へ小さくする */
async function shrinkImage(file){
  const u=URL.createObjectURL(file);
  try{
    const im=new Image();im.src=u;await im.decode();
    const s=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight));
    const cv=document.createElement('canvas');cv.width=Math.round(im.naturalWidth*s);cv.height=Math.round(im.naturalHeight*s);
    const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(im,0,0,cv.width,cv.height);
    const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',.85));
    if(!b)throw new Error('toBlob');
    return b;
  }finally{URL.revokeObjectURL(u)}
}
async function addImage(file){
  const b=await shrinkImage(file),id=newId('i');
  await imgTx('readwrite',s=>s.put(b,id));
  return id;
}
async function imageUrl(id){
  if(imgUrls[id])return imgUrls[id];
  const b=await imgTx('readonly',s=>s.get(id));
  return b?(imgUrls[id]=URL.createObjectURL(b)):null;
}
function hydrateImages(root){
  root.querySelectorAll('img[data-img]').forEach(im=>{
    imageUrl(im.dataset.img).then(u=>{if(u)im.src=u;else im.alt='写真が見つかりません'}).catch(()=>{im.alt='写真を読みこめません'});
  });
}
/* どの授業からも使われなくなった写真を消す */
function dropUnusedImages(ids){
  const used=new Set();store.lessons.forEach(l=>l.cards.forEach(c=>(c.images||[]).forEach(i=>used.add(i))));
  ids.filter(i=>!used.has(i)).forEach(i=>{
    if(imgUrls[i]){URL.revokeObjectURL(imgUrls[i]);delete imgUrls[i]}
    imgTx('readwrite',s=>s.delete(i)).catch(()=>{});
  });
}

/* ---------- 教材の部分を取り出す ----------
   教材は書きかえない。同じサイトにあるので、iframe に読みこんでボタンを外から押す。
   steps には先生が押したボタンを順に覚え、授業のときに同じ順で押す。 */
const ATTRS=['data-part','data-tab','data-mode','data-step'];
const CLICKABLE='button,a,[role="tab"],[role="button"],[onclick]';
const APPS=()=>window.IKECHAN_APPS||[];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let frameMsg='',frameToken=0;

function appUrl(path,teacher){
  const m=String(path).match(/^([^?#]*)(\?[^#]*)?(#.*)?$/);
  const base=m[1].split('/').map(encodeURIComponent).join('/');
  const q=new URLSearchParams((m[2]||'').slice(1));
  if(teacher)q.set('teacher','1');
  q.set('ws','0'); // ワークシートはとじて開く（教材の中のボタンで開ける）
  return '../'+base+'?'+q.toString()+(m[3]||'');
}
function cleanText(el){
  const c=el.cloneNode(true);
  c.querySelectorAll('rt,rp,small,script,style').forEach(x=>x.remove());
  c.querySelectorAll('span,div,br').forEach(x=>x.before(' '));
  return c.textContent.replace(/\s+/g,' ').trim().slice(0,40);
}
const isVisible=el=>!!(el.offsetWidth||el.offsetHeight||el.getClientRects().length);
function stepOf(target){
  const el=target.closest&&target.closest(CLICKABLE+','+ATTRS.map(a=>`[${a}]`).join(','));
  if(!el)return null;
  const label=cleanText(el);
  for(const a of ATTRS)if(el.hasAttribute(a))return {attr:a,val:el.getAttribute(a),label};
  if(el.id)return {id:el.id,label};
  return label?{tag:el.tagName.toLowerCase(),text:label,label}:null;
}
function findStep(doc,s){
  let list=[];
  if(s.attr&&ATTRS.includes(s.attr)){
    const all=[...doc.querySelectorAll(`[${s.attr}]`)].filter(e=>e.getAttribute(s.attr)===s.val);
    list=all.filter(e=>e.matches(CLICKABLE));if(!list.length)list=all;
  }else if(s.id){const e=doc.getElementById(s.id);if(e)list=[e]}
  else if(s.tag&&/^[a-z0-9-]+$/.test(s.tag)){
    list=[...doc.querySelectorAll(s.tag)].filter(e=>cleanText(e)===s.text);
  }
  return list.find(isVisible)||null;
}
async function waitFor(fn,ms){
  const end=Date.now()+ms;
  while(Date.now()<end){try{const v=fn();if(v)return v}catch(e){return null}await sleep(100)}
  return null;
}
/* いま画面に出ている「部分」のボタン（2つ以上ならんでいるものだけ） */
function scanParts(doc){
  const parts=[];
  for(const a of ATTRS){
    const seen=new Set(),group=[];
    doc.querySelectorAll(`[${a}]`).forEach(el=>{
      const v=el.getAttribute(a);
      if(seen.has(v)||!el.matches(CLICKABLE)||!isVisible(el))return;
      const label=cleanText(el);if(!label)return;
      seen.add(v);group.push({attr:a,val:v,label});
    });
    if(group.length>=2)parts.push(...group);
  }
  return parts;
}
function hideOthers(doc,steps){
  const last={};steps.forEach(s=>{if(s.attr&&ATTRS.includes(s.attr))last[s.attr]=s.val});
  const css=Object.entries(last).map(([a,v])=>{
    const not=`[${a}]:not([${a}=${JSON.stringify(v)}])`;
    return `button${not},a${not},[role="tab"]${not}`;
  }).join(',');
  if(!css)return;
  const st=doc.createElement('style');st.textContent=css+'{display:none!important}';doc.head.appendChild(st);
}
function stopFrame(){frameToken++;const h=$('stageApp');h.innerHTML='';h.hidden=true}
function setFrameMsg(s){frameMsg=s;const m=$('fMsg');if(m)m.textContent=s}
function loadFrame(){
  stopFrame();
  const c=L&&L.cards[idx];
  if(!hasApp(c))return;
  const token=frameToken,h=$('stageApp'),fr=document.createElement('iframe');
  fr.title=c.appName||'教材';fr.allow='autoplay; fullscreen';fr.src=appUrl(c.path,c.teacher);
  fr.addEventListener('load',async()=>{
    if(token!==frameToken)return;
    const steps=c.steps||[];
    if(!steps.length){setFrameMsg('');return}
    setFrameMsg('えらんだ部分を開いています…');
    let doc=null;try{doc=fr.contentDocument}catch(e){}
    if(!doc){setFrameMsg('この開き方では部分を自動で開けないので、教材全体を表示しています。');return}
    for(const s of steps){
      const el=await waitFor(()=>findStep(fr.contentDocument,s),4000);
      if(token!==frameToken)return;
      if(!el){setFrameMsg(`「${s.label}」が見つからなかったので、ここまでの画面を表示しています。`);return}
      el.click();await sleep(250);
      if(token!==frameToken)return;
    }
    if(!c.showAll)hideOthers(fr.contentDocument,steps);
    setFrameMsg('');
  });
  h.hidden=false;h.appendChild(fr);
}

  if(e.target.closest('[data-show]')){revealed[c.id]=true;renderPresent()}
  if(e.target.closest('[data-hide]')){revealed[c.id]=false;renderPresent()}
  const p=e.target.closest('[data-photo]');if(p){$('lbImg').src=photos[c.id][+p.dataset.photo];$('lb').hidden=false}
  const pv=e.target.closest('[data-img-view]');if(pv){const im=pv.querySelector('img');if(im&&im.src){$('lbImg').src=im.src;$('lb').hidden=false}}
  if(e.target.id==='tStart'){
    if(timer.run)stopTimer();else{timer.run=true;timer.h=setInterval(()=>{timer.left--;const t=$('tm');if(t){t.textContent=fmt(timer.left);t.classList.toggle('over',timer.left<0)}},1000)}
    e.target.textContent=timer.run?'とめる':'タイマー開始';
  }
  if(e.target.id==='tReset'){resetTimer();renderPresent()}
  if(e.target.id==='fReload')loadFrame();
  if(e.target.id==='fFull')$('stageApp').querySelector('iframe')?.requestFullscreen?.();
  if(e.target.id==='fAll'){c.showAll=!c.showAll;touch();renderPresent();loadFrame()}
});
$('vPresent').addEventListener('change',e=>{const id=e.target.dataset.up;if(!id)return;
  photos[id]=(photos[id]||[]).concat([...e.target.files].map(f=>URL.createObjectURL(f)));renderPresent()});
$('vPresent').addEventListener('input',e=>{if(e.target.classList.contains('write'))notes[L.cards[idx].id]=e.target.value});
$('lb').onclick=()=>{$('lb').hidden=true};

/* ---------- events: edit ---------- */
const byId=id=>L.cards.find(c=>c.id===id);
function updTotal(){const tt=totalMin(L),el=$('total');if(!el)return;el.textContent=`合計 ${tt}分 / ${L.minutes}分${tt>L.minutes?'（時間をこえています）':''}`;el.classList.toggle('over',tt>L.minutes)}
$('vEdit').addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='s-grade'){L.grade=t.value;header()}
  else if(t.id==='s-unit'){L.unit=t.value;header()}
  else if(t.id==='s-min'){L.minutes=Math.max(1,+t.value||45)}
  else if(t.dataset.f&&t.dataset.f!=='type'){const c=byId(t.closest('.ecard').dataset.id);c[t.dataset.f]=t.dataset.f==='min'?Math.max(0,+t.value||0):t.value;if(t.dataset.f==='title')renderStrip();
    if(t.dataset.f==='url'){const m=t.closest('.appbox').querySelector('.urlmsg');if(m)m.textContent=t.value&&!okUrl(t.value)?'http:// か https:// で始まるURLを入れてください。':''}}
  else return;
  touch();updTotal();
});
$('vEdit').addEventListener('change',async e=>{
  if(e.target.dataset.f==='type'){byId(e.target.closest('.ecard').dataset.id).type=e.target.value;touch();renderEdit();renderStrip();return}
  const cid=e.target.dataset.upimg;if(!cid)return;
  const c=byId(cid),files=[...e.target.files],box=e.target.closest('.appbox'),m=box.querySelector('.imsg');
  if(!c||!files.length)return;
  m.textContent='写真を入れています…';
  let bad=0;
  for(const f of files){try{c.images.push(await addImage(f))}catch(err){bad++}}
  touch();if(view==='edit'&&L&&L.cards.includes(c))renderEdit();
  if(bad)document.querySelector(`.ecard[data-id="${cid}"] .imsg`)?.replaceChildren(`${bad}まい 入れられませんでした。別の形式の画像（JPEG・PNG）でためしてください。`);
});
$('vEdit').addEventListener('click',e=>{
  const sg=e.target.closest('[data-seg]');
  if(sg){const id=sg.closest('.ecard').dataset.id,c=byId(id),k=sg.dataset.seg,v=sg.dataset.val;
    if(k==='who')c.who=v;
    if(k==='act')c.act=c.act===v?'':v;
    if(k==='use')c.uses=has(c,v)?c.uses.filter(u=>u!==v):[...c.uses,v];
    touch();renderEdit();
    document.querySelector(`.ecard[data-id="${id}"] [data-seg="${k}"][data-val="${v}"]`)?.focus();
    return}
  const a=e.target.closest('[data-act]');
  if(a){const id=a.closest('.ecard').dataset.id,cs=L.cards,i=cs.findIndex(c=>c.id===id);
    const act=a.dataset.act;
    if(act==='pick'){openPicker(id);return}
    if(act==='unpick'){const c=cs[i];APP_FIELDS.forEach(k=>delete c[k]);touch();renderEdit();return}
    if(act==='imgdel'){const c=cs[i],g=a.dataset.imgId;c.images=c.images.filter(x=>x!==g);touch();dropUnusedImages([g]);renderEdit();return}
    if(act==='del'){if(arm==='card-'+id){const gone=cs[i].images||[];cs.splice(i,1);arm=null;touch();dropUnusedImages(gone)}else arm='card-'+id}
    else{arm=null;
      if(act==='up'&&i>0)[cs[i-1],cs[i]]=[cs[i],cs[i-1]];
      if(act==='down'&&i<cs.length-1)[cs[i+1],cs[i]]=[cs[i],cs[i+1]];
      if(act==='copy'){const n=clone(cs[i]);n.id=newId('c');cs.splice(i+1,0,n)}}
    touch();renderEdit();renderStrip();return}
  const add=e.target.closest('[data-add]');
  if(add){const k=add.dataset.add;L.cards.push({id:newId('c'),type:k,title:typeOf(k).label,text:'',who:'all',act:'',uses:[],thing:'',min:5,url:'',urlName:'',reveal:'',images:[]});touch();renderEdit();renderStrip();
    const all=document.querySelectorAll('.ecard');all[all.length-1]?.scrollIntoView({behavior:'smooth',block:'center'})}
});

/* ---------- events: library ---------- */
function lessonExport(l){
  const used=new Set(l.cards.map(c=>c.type));
  /* 写真はとても大きくなるので渡さず、枚数だけ伝える */
  return JSON.stringify({app:'jugyo-board',lesson:{grade:l.grade,unit:l.unit,minutes:l.minutes,cards:l.cards.map(({id,images,imgMissing,...r})=>({...r,imgCount:(images||[]).length}))},customTypes:store.customTypes.filter(t=>used.has(t.key))});
}
function copyText(txt,msgEl,ta){
  const fb=()=>{ta.value=txt;ta.select();msgEl.textContent='自動でコピーできなかったので、「貼りつける欄」に表示しました。選んでコピーしてください。'};
  try{navigator.clipboard.writeText(txt).then(()=>msgEl.textContent='コピーしました。相手の「授業を受け取る」に貼りつけてもらってください。',fb)}catch(err){fb()}
}
$('vList').addEventListener('change',e=>{if(e.target.name==='tpl')newTpl=e.target.value});
$('vList').addEventListener('click',e=>{
  const la=e.target.closest('[data-la]');
  if(la){const id=la.closest('[data-lid]').dataset.lid,l=store.lessons.find(x=>x.id===id),act=la.dataset.la;
    if(act==='open')return openLesson(id,'present',0);
    if(act==='edit')return openLesson(id,'edit');
    if(act==='share')return copyText(lessonExport(l),$('lMsg'),$('iIn'));
    if(act==='dup'){const n=mkLesson(l);n.unit=(l.unit||'')+'（コピー）';store.lessons.push(n);arm=null;save();renderList();$('lMsg').textContent='複製しました。';return}
    if(act==='del'){if(arm==='del-'+id){const gone=l.cards.flatMap(c=>c.images||[]);store.lessons=store.lessons.filter(x=>x.id!==id);arm=null;save();dropUnusedImages(gone);renderList();$('lMsg').textContent='削除しました。';}else{arm='del-'+id;renderList()}return}
  }
  if(e.target.id==='nMake'){
    const tp=TEMPLATES.find(t=>t.key===newTpl)||TEMPLATES[0];
    const l=mkLesson({grade:$('nGrade').value.trim(),unit:$('nUnit').value.trim()||'新しい授業',minutes:Math.max(1,+$('nMin').value||45),cards:tp.cards});
    store.lessons.push(l);save();openLesson(l.id,'edit');window.scrollTo({top:0});return}
  if(e.target.id==='tAdd'){const name=$('tName').value.trim();newPhase=$('tPhase').value;
    if(!name){$('tMsg').textContent='種類の名前を入れてください。';return}
    if(Object.values(types()).some(t=>t.label===name)){$('tMsg').textContent='同じ名前の種類がすでにあります。';return}
    store.customTypes.push({key:newId('t'),label:name,phase:newPhase});save();renderList();$('tMsg').textContent=`「${name}」を足しました。`;return}
  const dt=e.target.closest('[data-deltype]');
  if(dt){const k=dt.dataset.deltype,n=store.lessons.filter(l=>l.cards.some(c=>c.type===k)).length;
    if(n){arm=null;renderList();$('tMsg').textContent=`この種類を使っている授業が${n}件あるので削除できません。先にカードの種類を変えてください。`;return}
    if(arm==='type-'+k){store.customTypes=store.customTypes.filter(t=>t.key!==k);arm=null;save();renderList();$('tMsg').textContent='削除しました。'}else{arm='type-'+k;renderList()}return}
  if(e.target.id==='iLoad'){
    try{const d=JSON.parse($('iIn').value);const src=d.lesson||d;if(!Array.isArray(src.cards))throw 0;
      (d.customTypes||[]).forEach(t=>{if(t.key&&t.label&&!store.customTypes.some(x=>x.key===t.key))store.customTypes.push(normalizeCustom(t))});
      const keys=new Set(store.customTypes.map(t=>t.key));let need=0;
      src.cards.forEach(c=>{normalizeCard(c,keys);c.images=[];const n=Math.max(0,Math.floor(+c.imgCount)||0);delete c.imgCount;if(n){c.imgMissing=n;need+=n}else delete c.imgMissing});
      const l=mkLesson({grade:src.grade||'',unit:src.unit||'受け取った授業',minutes:+src.minutes||45,cards:src.cards});
      store.lessons.push(l);save();renderList();$('iMsg').textContent=`「${l.unit}」を読みこみました。`+(need?`写真が ${need}まい あった授業です。「流れを作る」で入れなおしてください。`:'')}
    catch(err){$('iMsg').textContent='読みこめませんでした。「共有用にコピー」で出た文字を、そのまま全部貼りつけてください。'}}
});

if(new URLSearchParams(location.search).has('debug'))window.__dbg={scanParts,stepOf,findStep,appUrl,APPS,normalizeCard,get lesson(){return L},get steps(){return P.steps},store};
route();
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1),cur=L?(view==='edit'?L.id+'-edit':L.id+'-step-'+(idx+1)):'list';if(h!==cur)route()});
</script>
</html>
